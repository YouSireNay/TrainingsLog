<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trainingslog</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#192025" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Trainingslog">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: eine Spalte bis 760px, oben Tabs; Übungen und Verlauf mit Kategorie-Seitenleiste links */
  --bg:#eef1f4; --surface:#ffffff; --surface-2:#e5eaef; --ink:#13202a; --muted:#566573; --line:#d2dae1;
  --accent:#1b74b8; --accent-ink:#ffffff; --accent-soft:#dbe9f5;
  --pr:#8f5c0e; --pr-soft:#f6e6c8; --danger:#b3361f; --danger-soft:#f7e0da; --ok:#2a8a52;
  --font-display:'Barlow Condensed','Arial Narrow',sans-serif;
  --font-body:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r:10px; color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#101417; --surface:#192025; --surface-2:#222a30; --ink:#e6ecf1; --muted:#95a3ae; --line:#2c353c;
    --accent:#45a6ea; --accent-ink:#06121b; --accent-soft:#15324a;
    --pr:#f0b54e; --pr-soft:#3d2e12; --danger:#f17a63; --danger-soft:#3e1f19; --ok:#5cc489; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101417; --surface:#192025; --surface-2:#222a30; --ink:#e6ecf1; --muted:#95a3ae; --line:#2c353c;
  --accent:#45a6ea; --accent-ink:#06121b; --accent-soft:#15324a;
  --pr:#f0b54e; --pr-soft:#3d2e12; --danger:#f17a63; --danger-soft:#3e1f19; --ok:#5cc489; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--font-body);-webkit-tap-highlight-color:transparent}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default;opacity:.45}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
h2,h3{text-wrap:balance}

.top{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{max-width:760px;margin:0 auto;padding:10px 16px 2px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--font-display);font-weight:700;font-size:1.4rem;letter-spacing:.04em;text-transform:uppercase}
.brand span{color:var(--accent)}
.sync{font-size:.8rem;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync.ok::before{background:var(--ok)} .sync.saving::before{background:var(--accent)} .sync.err::before,.sync.warn::before{background:var(--danger)}
.tabs{max-width:760px;margin:0 auto;padding:0 8px;display:flex;overflow-x:auto;scrollbar-width:none}
.tabs a{flex:1 0 auto;text-align:center;padding:10px 8px 9px;color:var(--muted);text-decoration:none;font-weight:600;font-size:.95rem;border-bottom:3px solid transparent}
.tabs a.on{color:var(--accent);border-bottom-color:var(--accent)}
main{max-width:760px;margin:0 auto;padding:16px 16px 96px;display:flex;flex-direction:column;gap:14px}

.h{font-family:var(--font-display);font-size:1.45rem;font-weight:600;margin:0;text-transform:uppercase;letter-spacing:.03em}
.sh{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.hint{font-size:.88rem;color:var(--muted);margin:0}
.empty{color:var(--muted);margin:0;font-size:.95rem}
.pad{padding:12px 14px}
.note{background:var(--danger-soft);color:var(--danger);border-radius:var(--r);padding:10px 14px;font-size:.9rem}

.primary,.ghost,.danger{border-radius:8px;padding:10px 16px;font-weight:600;border:1px solid transparent}
.primary{background:var(--accent);color:var(--accent-ink)}
.ghost{background:var(--surface);border-color:var(--line);color:var(--ink)}
.danger{background:var(--danger-soft);color:var(--danger)}
.sm{padding:7px 12px;font-size:.9rem}
.row-btns{display:flex;gap:8px;flex-wrap:wrap}
.row-btns .primary{flex:1}

.daynav{display:grid;grid-template-columns:52px 1fr 52px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.daynav .icon{height:58px;border:0;background:none;font-size:2rem;line-height:1;color:var(--accent)}
.dtitle{border:0;background:none;padding:6px;display:flex;flex-direction:column;align-items:center;min-width:0}
.dtitle .d{font-family:var(--font-display);font-size:clamp(1.1rem,5vw,1.4rem);font-weight:600;text-transform:uppercase;letter-spacing:.03em;text-align:center}
.dtitle .sub{font-size:.8rem;color:var(--muted)}

.plan{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:12px 14px;background:var(--accent-soft);border-radius:var(--r)}
.plan .lbl{display:flex;flex-direction:column;margin-right:auto;min-width:0}
.plan .lbl small{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.plan .lbl strong{font-family:var(--font-display);font-size:1.45rem;font-weight:600;line-height:1.15}
.plan a{color:var(--accent);font-weight:600}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.card-h{display:flex;align-items:center;gap:8px;padding:10px 8px 8px 14px;border-bottom:2px solid var(--accent)}
.card-h h3{margin:0;font-family:var(--font-display);font-size:1.32rem;font-weight:600;flex:1;min-width:0;overflow-wrap:anywhere;line-height:1.15}
.card-h h3 small{display:block;font-family:var(--font-body);font-size:.75rem;font-weight:500;color:var(--muted)}
.badge{font-size:.78rem;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.badge.done{background:var(--accent-soft);color:var(--accent)}
.x{border:0;background:none;color:var(--muted);font-size:1.35rem;width:38px;height:38px;border-radius:8px;flex:none}
.last{padding:8px 14px 0;font-size:.85rem;color:var(--muted)}
.last b{color:var(--ink);font-weight:600}
.steps{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:10px 14px}
.stp label{display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;margin-bottom:4px}
.stp .row{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface-2)}
.stp .row button{border:0;background:none;font-size:1.6rem;line-height:1;color:var(--accent);height:50px}
.stp input{width:100%;min-width:0;border:0;border-left:1px solid var(--line);border-right:1px solid var(--line);background:var(--surface);text-align:center;font-family:var(--font-display);font-size:1.6rem;font-weight:600;font-variant-numeric:tabular-nums;padding:0}
.card-a{display:flex;gap:8px;padding:0 14px 12px;flex-wrap:wrap}
.card-a .primary{flex:1}
.err{color:var(--danger);font-size:.85rem;margin:0;padding:0 14px 8px}
.err:empty{display:none}
.sets{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.set{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--line);cursor:pointer;font-variant-numeric:tabular-nums}
.set:last-child{border-bottom:0}
.set.sel{background:var(--accent-soft)}
.set .n{color:var(--muted);font-size:.85rem;width:1.4em}
.set b{font-family:var(--font-display);font-size:1.3rem;font-weight:600}
.set .sw{margin-left:auto;min-width:6em;text-align:right}
.set .sr{min-width:5.5em;text-align:right}
.pr{font-size:.7rem;font-weight:700;letter-spacing:.04em;background:var(--pr-soft);color:var(--pr);padding:2px 6px;border-radius:4px}
.add-ex{border:2px dashed var(--line);background:none;border-radius:var(--r);padding:14px;font-weight:600;color:var(--accent)}
.sync-tpl{border:0;background:none;color:var(--accent);font-weight:600;padding:4px 0;text-align:left}

.split{display:grid;grid-template-columns:150px minmax(0,1fr);gap:14px;align-items:start}
.side{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;position:sticky;top:100px}
.side button{border:0;border-left:3px solid transparent;border-bottom:1px solid var(--line);border-radius:0;background:none;text-align:left;padding:11px 10px 11px 11px;display:flex;justify-content:space-between;align-items:baseline;gap:6px;font-weight:600;font-size:.92rem;overflow-wrap:anywhere}
.side button:last-child{border-bottom:0}
.side button.on{border-left-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.side .cnt{color:var(--muted);font-weight:400;font-size:.8rem;font-variant-numeric:tabular-nums}
.side .add{color:var(--accent)}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
@media (max-width:480px){
  .split{grid-template-columns:104px minmax(0,1fr);gap:10px}
  .side button{padding:10px 6px 10px 8px;font-size:.84rem}
  .steps{gap:8px;padding:10px 10px}
  main .tiles{grid-template-columns:1fr 1fr;gap:8px}
  main .tile{padding:8px 10px}
  main .tile .v{font-size:1.35rem}
  main .wide{display:none}
  main td,main th{padding:8px 8px}
}

.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.item{border:0;border-bottom:1px solid var(--line);background:none;text-align:left;padding:12px 14px;display:flex;flex-direction:column;gap:2px;width:100%}
.item:last-child{border-bottom:0}
.item .nm{font-weight:600}
.item .meta{font-size:.82rem;color:var(--muted)}
.item.off .nm{color:var(--muted)}
.item-row{display:flex;align-items:stretch;border-bottom:1px solid var(--line)}
.item-row:last-child{border-bottom:0}
.item-row .item{border-bottom:0;flex:1;min-width:0}
.hist-btn{border:0;border-left:1px solid var(--line);background:none;width:54px;flex:none;color:var(--accent);display:flex;align-items:center;justify-content:center}
.x.hb{color:var(--accent);display:flex;align-items:center;justify-content:center}
.back{align-self:flex-start;border:0;background:none;color:var(--accent);font-weight:600;padding:2px 0}
.grp{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;padding:10px 14px 4px;background:var(--surface-2)}

.chips,.seg{display:flex;flex-wrap:wrap;gap:6px}
.chips button,.seg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.88rem;font-weight:600;color:var(--muted)}
.chips button.on,.seg button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chips button.nohist{border-style:dashed}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.tile .l{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.tile .v{font-family:var(--font-display);font-size:1.65rem;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}
.tile .v small{font-size:.9rem;color:var(--muted);font-weight:500}
.tile .s{font-size:.8rem;color:var(--muted)}

.chart{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 4px 2px}
.chart svg{display:block;width:100%;height:auto;touch-action:pan-y}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .axis{fill:var(--muted);font-size:11px;font-family:var(--font-body)}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .ar{fill:var(--accent);fill-opacity:.12}
.chart .dot{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.chart .endl{fill:var(--ink);font-weight:700;font-size:12px;font-family:var(--font-body)}
.chart .endl{paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round}
.chart .ch{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);padding:6px 10px;border-radius:6px;font-size:.8rem;line-height:1.4;white-space:nowrap;transform:translate(-50%,-100%);display:none;z-index:2}
.tip span{opacity:.85}

.tbl{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:.9rem}
th{text-align:left;font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;font-weight:600}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
.num{text-align:right;white-space:nowrap}
tr[data-act]{cursor:pointer}
tr[data-act]:hover td{background:var(--surface-2)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.panel h2{margin:0;font-family:var(--font-display);font-size:1.35rem;font-weight:600}
.field label{display:block;font-size:.8rem;font-weight:600;color:var(--muted);margin-bottom:4px}
.field input,.field select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}
textarea{min-height:90px;font-family:ui-monospace,monospace;font-size:.8rem}
.mt{margin-top:8px}
.check{display:flex;gap:8px;align-items:flex-start;font-size:.92rem}
.check input{margin-top:4px}

.rot{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.rot li{display:flex;align-items:center;flex-wrap:wrap;gap:6px;padding:7px 8px 7px 12px;border-bottom:1px solid var(--line)}
.rot li:last-child{border-bottom:0}
.rot .n{color:var(--muted);font-size:.85rem;width:1.4em;font-variant-numeric:tabular-nums}
.rot .nm{flex:1 1 120px;font-weight:600;min-width:0;overflow-wrap:anywhere}
.rot li.rest .nm{color:var(--muted);font-style:italic}
.rot li.next{background:var(--accent-soft)}
.mini{border:1px solid var(--line);background:var(--surface);border-radius:6px;min-width:36px;height:36px;color:var(--muted);font-weight:600}
.ms{display:flex;align-items:center;gap:6px;font-size:.88rem;color:var(--muted);font-variant-numeric:tabular-nums}
.tplrow{border:0;background:none;text-align:left;padding:12px 14px;display:flex;flex-direction:column;gap:3px;width:100%}
.tplrow .nm{font-family:var(--font-display);font-size:1.3rem;font-weight:600}
.tplrow .meta{font-size:.84rem;color:var(--muted)}

.onboard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:12px}
.onboard ul{margin:0;padding-left:1.2em;color:var(--muted);font-size:.92rem}

.modal{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.backdrop{position:absolute;inset:0;background:rgb(0 0 0 / .5)}
.sheet{position:relative;background:var(--surface);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px 24px;display:flex;flex-direction:column;gap:12px}
@media (min-width:640px){.modal{align-items:center}.sheet{border-radius:16px}}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sheet .list{max-height:44vh;overflow:auto}

#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:.92rem;opacity:0;pointer-events:none;z-index:30;max-width:calc(100% - 32px);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:no-preference){#toast{transition:opacity .2s,transform .2s}}

.bar-r{display:flex;align-items:center;gap:10px;min-width:0}
.wchip{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border:1px solid var(--line);border-radius:999px;color:var(--ink);text-decoration:none;font-weight:600;font-size:.88rem;white-space:nowrap;font-variant-numeric:tabular-nums}
.wchip svg{color:var(--accent);flex:none}
.wchip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.wchip.on svg{color:var(--accent-ink)}
@media (max-width:480px){.sync .t{display:none}}
.wform{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px 14px 6px}
.wform .field label{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;font-weight:600;margin-bottom:4px}
.wform input[type=date]{height:52px;min-width:0}
.wnote{padding:2px 14px 10px}
.wnote label{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.tiles .span2{grid-column:1/-1}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.82rem;color:var(--muted)}
.lg-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);margin-right:6px}
.lg-line{display:inline-block;width:18px;height:2px;background:var(--accent);vertical-align:middle;margin-right:6px}
.chart .wdot{fill:var(--muted);stroke:var(--surface);stroke-width:1.5}
details.panel summary{cursor:pointer;font-weight:600}
details.panel .list{margin-top:10px}
</style>
</head>
<body>
<header class="top">
  <div class="bar"><div class="brand">Trainings<span>log</span></div><div class="bar-r"><a id="wchip" class="wchip" href="#gewicht" aria-label="Körpergewicht"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M7.5 10a6 6 0 0 1 9 0"/><path d="M12 10.5l1.8-2.2"/></svg><span id="wchip-t">Gewicht</span></a><div id="sync" class="sync">Verbinde …</div></div></div>
  <nav class="tabs" aria-label="Bereiche">
    <a href="#training">Training</a>
    <a href="#verlauf">Verlauf</a>
    <a href="#uebungen">Übungen</a>
    <a href="#vorlagen">Vorlagen</a>
    <a href="#daten">Daten</a>
  </nav>
</header>
<main id="view"></main>
<div id="modal" class="modal" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
/* Eigenständige Offline-Version: speichert nur auf diesem Gerät (localStorage). */
const STANDALONE = true;
if (STANDALONE && 'serviceWorker' in navigator) window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(() => {}); });
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
/* ---------- Helfer ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const pad = n => String(n).padStart(2, '0');
const ds = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parseDs = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const today = () => ds(new Date());
const addDays = (s, n) => { const d = parseDs(s); d.setDate(d.getDate() + n); return ds(d); };
const daysBetween = (a, b) => Math.round((parseDs(b) - parseDs(a)) / 864e5);
const fmtLong = s => parseDs(s).toLocaleDateString('de-DE', {weekday:'long', day:'numeric', month:'long'});
const fmtShort = s => parseDs(s).toLocaleDateString('de-DE', {weekday:'short', day:'numeric', month:'short'});
const fmtTile = s => parseDs(s).toLocaleDateString('de-DE', parseDs(s).getFullYear() === new Date().getFullYear() ? {weekday:'short', day:'numeric', month:'short'} : {day:'numeric', month:'short', year:'numeric'});
const fmtTbl = s => parseDs(s).toLocaleDateString('de-DE', {day:'2-digit', month:'2-digit', year:'2-digit'});
const num = (n, d = 2) => (Math.round(n * 10 ** d) / 10 ** d).toLocaleString('de-DE', {maximumFractionDigits:d});

const byName = (a, b) => a.name.localeCompare(b.name, 'de');
const CHART_ICON = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h16"/><path d="M5 15l4-5 4 3 6-7"/><circle cx="19" cy="6" r="1.2" fill="currentColor"/></svg>';
const low = s => String(s || '').trim().toLowerCase();

/* ---------- Zustand ---------- */
const EMPTY_CFG = () => ({v:1, categories:[], exercises:[], templates:[], rotation:[]});
const S = {
  cfg: EMPTY_CFG(), days: {}, view: 'training', date: today(),
  catSel: {uebungen:'__all', verlauf:'__all'}, histEx: null, metric: 'e1rm',
  drafts: {}, errs: {}, tplEdit: null, picker: null, exEdit: null,
  cfgConfirmed: false, netNote: null, skipOnboard: false, busy: false
};
function normCfg(c) {
  c = c && typeof c === 'object' ? c : {};
  const arr = x => Array.isArray(x) ? x : [];
  return {
    v: 1,
    categories: arr(c.categories).filter(x => x && x.id && x.name),
    exercises: arr(c.exercises).filter(x => x && x.id && x.name).map(x => ({id:x.id, name:String(x.name), catId:x.catId || null, step:+x.step > 0 ? +x.step : 2.5, repStep:+x.repStep >= 1 ? Math.round(+x.repStep) : 1, aliases:arr(x.aliases), archived:!!x.archived})),
    templates: arr(c.templates).filter(x => x && x.id).map(t => ({id:t.id, name:String(t.name || 'Vorlage'), items:arr(t.items).filter(i => i && i.exId).map(i => ({exId:i.exId, sets:Math.max(1, Math.min(20, +i.sets || 2))}))})),
    rotation: arr(c.rotation).filter(x => x && (x.type === 'rest' || x.tplId)).map(x => x.type === 'rest' ? {type:'rest'} : {type:'t', tplId:x.tplId})

}
function normDay(d, date) {
  d = d && typeof d === 'object' ? d : {};

    date: date, tplId: d.tplId || null, rotIdx: Number.isInteger(d.rotIdx) ? d.rotIdx : null,
    entries: (Array.isArray(d.entries) ? d.entries : []).filter(e => e && e.exId).map(e => ({
      exId: e.exId, target: +e.target || 0,
      sets: (Array.isArray(e.sets) ? e.sets : []).filter(s => s && isFinite(+s.w) && isFinite(+s.r)).map(s => ({w:+s.w, r:+s.r}))
    }))

}
const exById = id => S.cfg.exercises.find(e => e.id === id);
const catById = id => S.cfg.categories.find(c => c.id === id);
const catName = id => (catById(id) || {}).name || 'Ohne Kategorie';
const tplById = id => S.cfg.templates.find(t => t.id === id);

const ensureDay = date => S.days[date] || (S.days[date] = {date, tplId:null, rotIdx:null, entries:[]});
const sortedDays = () => Object.values(S.days).sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);

/* ---------- Speicher: claude db (privat pro Person), sonst localStorage ---------- */
const LS_KEY = 'trainingslog.v1';
const Store = {
  mode: 'loading', cfgRef: null, daysCol: null, ver: {}, done: {}, timers: {}, chains: {}, err: false,
  cacheLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify({src:this.mode, cfg:S.cfg, days:S.days, weights:S.weights})); } catch (e) {} },
  loadLocal() {
    try {
      const raw = localStorage.getItem(LS_KEY); if (!raw) return null;
      const o = JSON.parse(raw); S.cfg = normCfg(o.cfg); S.days = {}; S.weights = o.weights ? normWeights(o.weights) : (S.weights || {}); S.wDraft = null;
      for (const k in (o.days || {})) { const d = normDay(o.days[k], k); if (!isEmptyDay(d)) S.days[k] = d; }
      return o.src || 'local';
    } catch (e) { return null; }
  },
  dirty(key) { return this.timers[key] != null || (this.ver[key] || 0) !== (this.done[key] || 0); },
  anyDirty() { return Object.keys(this.ver).some(k => this.dirty(k)); },
  async run(writer) {
    try { await writer(); }
    catch (e) {
      const c = e && e.code;
      if (c === 'unavailable' || c === 'resource_exhausted') { await sleep((c === 'unavailable' ? 700 : 1800) + Math.random() * 600); await writer(); }
      else throw e;
    }
  },
  schedule(key, writer) {
    this.ver[key] = (this.ver[key] || 0) + 1; const v = this.ver[key];
    this.cacheLocal();
    if (this.mode !== 'db') { this.done[key] = v; setSync(); return; }
    clearTimeout(this.timers[key]);
    this.timers[key] = setTimeout(() => {
      this.timers[key] = null;
      this.chains[key] = (this.chains[key] || Promise.resolve())
        .then(() => this.run(writer))
        .then(() => { this.done[key] = Math.max(this.done[key] || 0, v); this.err = false; setSync(); },
              e => { this.done[key] = Math.max(this.done[key] || 0, v); onWriteError(e); setSync(); });
    }, 450);
    setSync();
  },
  async writeNow(key, writer) {
    clearTimeout(this.timers[key]); this.timers[key] = null;
    this.ver[key] = (this.ver[key] || 0) + 1; const v = this.ver[key];
    const p = (this.chains[key] || Promise.resolve()).catch(() => {}).then(() => this.run(writer));
    this.chains[key] = p;
    try { await p; this.err = false; } finally { this.done[key] = Math.max(this.done[key] || 0, v); setSync(); }
  },
  async init() {
    const src = this.loadLocal();
    if (STANDALONE) { this.mode = 'local'; S.cfgConfirmed = true; this.cacheLocal(); render(); return; }
    render();
    let db = null, user = null, uid = null;
    try { if (window.claude && typeof claude.use === 'function') [db, user] = await Promise.all([claude.use('db'), claude.use('user')]); } catch (e) {}
    try { uid = user ? await user.id() : null; } catch (e) {}
    if (!db || !uid) { this.mode = 'local'; S.cfgConfirmed = true; this.cacheLocal(); render(); return; }
    this.mode = 'db';
    try {
      this.cfgRef = db.doc('data/users/' + uid + '/config');
      this.daysCol = this.cfgRef.collection('days');
    } catch (e) { this.mode = 'local'; S.cfgConfirmed = true; render(); return; }
    const uploadLocal = src === 'local';
    const timer = setTimeout(() => { if (!S.cfgConfirmed) { S.netNote = 'Deine Daten sind gerade nicht erreichbar. Was du einträgst, bleibt in diesem Browser und wird gespeichert, sobald die Verbindung steht.'; rerender(); } }, 10000);
    this.cfgRef.onSnapshot(snap => {
      if (!snap.metadata.fromCache) { S.cfgConfirmed = true; clearTimeout(timer); S.netNote = null; }
      if (snap.exists) { if (!this.dirty('cfg')) S.cfg = normCfg(clone(snap.data())); }
      else if (!snap.metadata.fromCache && uploadLocal && hasContent(S.cfg)) saveCfg();
      this.cacheLocal(); rerender();
    }, e => { clearTimeout(timer); S.cfgConfirmed = true; S.netNote = 'Die Verbindung zu deinem Speicher ist unterbrochen. Änderungen bleiben vorerst in diesem Browser.'; rerender(); });
    let firstDays = true;
    this.daysCol.onSnapshot(qs => {
      const seen = new Set();
      qs.docs.forEach(d => { seen.add(d.id); if (!this.dirty('day:' + d.id)) { const nd = normDay(clone(d.data()), d.id); if (isEmptyDay(nd)) delete S.days[d.id]; else S.days[d.id] = nd; } });
      if (!qs.metadata.fromCache) {
        for (const k of Object.keys(S.days)) {
          if (seen.has(k) || this.dirty('day:' + k)) continue;
          if (firstDays && uploadLocal) saveDay(k); else delete S.days[k];
        }
        firstDays = false;
      }
      this.cacheLocal(); rerender();
    }, e => { S.netNote = 'Die Verbindung zu deinem Speicher ist unterbrochen. Änderungen bleiben vorerst in diesem Browser.'; rerender(); });
    render();
  }
};
function saveCfg() { Store.schedule('cfg', () => Store.cfgRef.set(clone(S.cfg))); }
function saveDay(date) {
  if (isEmptyDay(S.days[date])) delete S.days[date];
  Store.schedule('day:' + date, () => { const d = S.days[date]; return isEmptyDay(d) ? Store.daysCol.doc(date).delete() : Store.daysCol.doc(date).set(clone(d)); });
}
async function writeDaysNow(dates, onProg) {
  for (const d of dates) if (isEmptyDay(S.days[d])) delete S.days[d];
  Store.cacheLocal();
  if (Store.mode !== 'db') return;
  let k = 0;
  for (const d of dates) {
    await Store.writeNow('day:' + d, () => { const day = S.days[d]; return isEmptyDay(day) ? Store.daysCol.doc(d).delete() : Store.daysCol.doc(d).set(clone(day)); });
    k++; if (onProg) onProg(k, dates.length);
    await sleep(25);
  }
}
function onWriteError(e) {
  Store.err = true;
  const c = e && e.code;
  if (c === 'quota_exceeded') toast('Dein Speicher ist voll. Lösche alte Trainings oder Übungen, dann klappt es wieder.');
  else if (c === 'invalid_argument') toast('Speichern wurde abgelehnt. In dieser Ansicht kannst du nichts ändern.');
  else toast('Speichern hat nicht geklappt. Deine Änderung bleibt in diesem Browser.');
}
function setSync() {
  const el = $('#sync'); if (!el) return;
  let cls = '', txt = 'Verbinde …';
  if (Store.mode === 'local' && STANDALONE) { cls = navigator.onLine ? 'ok' : 'saving'; txt = navigator.onLine ? 'Auf diesem Gerät' : 'Offline · gespeichert'; }
  else if (Store.mode === 'local') { cls = 'warn'; txt = 'Nur in diesem Browser'; }
  else if (Store.mode === 'db') {
    if (Store.err) { cls = 'err'; txt = 'Nicht gespeichert'; }
    else if (Store.anyDirty()) { cls = 'saving'; txt = 'Speichert …'; }
    else if (!S.cfgConfirmed) { txt = 'Lädt …'; }
    else { cls = 'ok'; txt = 'Gespeichert'; }
  }
  el.className = 'sync ' + cls; el.innerHTML = '<span class="t">' + esc(txt) + '</span>'; el.title = txt; el.setAttribute('aria-label', txt);
}

/* ---------- Auswertungen ---------- */
function sessions(exId, beforeDate) {
  const out = [];
  for (const d of Object.values(S.days)) {
    if (beforeDate && d.date >= beforeDate) continue;
    const e = d.entries.find(x => x.exId === exId);
    if (!e || !e.sets.length) continue;
    let best = 0, maxW = 0, vol = 0, maxR = 0;
    for (const s of e.sets) { best = Math.max(best, e1rm(s.w, s.r)); maxW = Math.max(maxW, s.w); vol += s.w * s.r; maxR = Math.max(maxR, s.r); }
    out.push({date:d.date, sets:e.sets, e1rm:best, maxW, vol, maxR});
  }
  return out.sort((a, b) => a.date < b.date ? 1 : -1);
}
const lastSession = (exId, date) => sessions(exId, date)[0] || null;
const bestBefore = (exId, date) => sessions(exId, date).reduce((m, s) => Math.max(m, s.e1rm), 0);
const METRICS = {
  e1rm: {label:'Gesch. 1RM', unit:'kg', dec:1, get:s => s.e1rm},
  maxw: {label:'Max. Gewicht', unit:'kg', dec:2, get:s => s.maxW},
  vol:  {label:'Volumen', unit:'kg', dec:0, get:s => s.vol},
  reps: {label:'Max. Wdh.', unit:'Wdh.', dec:0, get:s => s.maxR}
};

/* ---------- Rhythmus ---------- */
function rotIndexForDay(d) {
  const rot = S.cfg.rotation, len = rot.length; if (!len) return -1;
  if (Number.isInteger(d.rotIdx) && d.rotIdx >= 0 && d.rotIdx < len) {
    const it = rot[d.rotIdx];
    if (it.type === 'rest' || it.tplId === d.tplId || !rot.some(x => x.tplId === d.tplId)) return d.rotIdx;
  }
  return d.tplId ? rot.findIndex(x => x.tplId === d.tplId) : -1;
}
function suggest(date) {
  const rot = S.cfg.rotation, len = rot.length; if (!len) return null;
  const prev = sortedDays().filter(d => d.date < date && (d.tplId || Number.isInteger(d.rotIdx))).reverse();
  let i = -1, pd = null;
  for (const d of prev) { i = rotIndexForDay(d); if (i >= 0) { pd = d; break; } }
  if (!pd) return {item:rot[0], idx:0, after:null};
  let n = (i + 1) % len, free = daysBetween(pd.date, date) - 1, guard = 0;
  while (rot[n].type === 'rest' && free > 0 && guard < len) { free--; n = (n + 1) % len; guard++; }
  return {item:rot[n], idx:n, after:pd};
}
function nextNonRest(idx) {
  const rot = S.cfg.rotation;
  for (let k = 1; k <= rot.length; k++) { const j = (idx + k) % rot.length; if (rot[j].type !== 'rest') return {item:rot[j], idx:j}; }
  return null;
}
function startTemplate(date, tplId, rotIdx) {
  const t = tplById(tplId); if (!t) return;
  const rot = S.cfg.rotation, len = rot.length;
  if (!Number.isInteger(rotIdx)) {
    rotIdx = null;
    if (len) {
      const sg = suggest(date), base = sg ? sg.idx : 0;
      const occ = rot.map((x, i) => x.tplId === tplId ? i : -1).filter(i => i >= 0);
      if (occ.length) { occ.sort((a, b) => ((a - base + len) % len) - ((b - base + len) % len)); rotIdx = occ[0]; }
      else if (sg) rotIdx = sg.idx;
    }
  }
  const day = ensureDay(date);
  day.entries = day.entries.filter(e => e.sets.length);
  for (const it of t.items) {
    if (!exById(it.exId)) continue;
    const e = day.entries.find(x => x.exId === it.exId);
    if (e) e.target = it.sets; else day.entries.push({exId:it.exId, target:it.sets, sets:[]});
  }
  const order = t.items.map(i => i.exId);
  day.entries.sort((a, b) => { const ia = order.indexOf(a.exId), ib = order.indexOf(b.exId); return (ia < 0 ? 999 : ia) - (ib < 0 ? 999 : ib); });
  day.tplId = tplId; day.rotIdx = rotIdx;
  saveDay(date); render();
  if (!t.items.length) toast('Die Vorlage „' + t.name + '“ ist noch leer. Füge Übungen hinzu und übernimm sie danach in die Vorlage.');
}

/* ---------- Rendering ---------- */
let pendingRender = false;
function rerender() {
  const a = document.activeElement;
  if (a && a.closest && a.closest('#view') && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) { pendingRender = true; return; }
  render();
}
document.addEventListener('focusout', () => { if (pendingRender) setTimeout(() => { if (pendingRender) rerender(); }, 0); });

function render() {
  pendingRender = false;
  document.querySelectorAll('.tabs a').forEach(a => a.classList.toggle('on', a.getAttribute('href') === '#' + S.view));
  let h = S.netNote ? `<div class="note">${esc(S.netNote)}</div>` : '';
  if (S.view === 'training') h += renderTraining();
  else if (S.view === 'verlauf') h += renderHistory();
  else if (S.view === 'uebungen') h += renderExercises();
  else if (S.view === 'vorlagen') h += renderTemplates();
  else if (S.view === WEIGHT_VIEW) h += renderWeight();
  else h += renderData();
  $('#view').innerHTML = h;
  updateWeightChip();
  if (S.view === WEIGHT_VIEW) drawWeightChart();
  if (S.view === 'verlauf') drawChart();
  setSync();
}

/* Training */
function renderTraining() {
  const loading = !hasContent(S.cfg) && !S.cfgConfirmed;
  if (loading) return `<p class="empty">Lade deine Daten …</p>`;
  if (!hasContent(S.cfg) && !S.skipOnboard) return onboardHtml();
  const date = S.date, day = S.days[date], diff = daysBetween(date, today());
  const sub = diff === 0 ? 'Heute' : (diff > 0 ? `vor ${diff} Tag${diff > 1 ? 'en' : ''} · zurück zu heute` : `in ${-diff} Tag${diff < -1 ? 'en' : ''} · zurück zu heute`);
  let h = `<div class="daynav">
    <button class="icon" data-act="day-prev" aria-label="Vorheriger Tag">‹</button>
    <button class="dtitle" data-act="day-today"><span class="d">${esc(fmtLong(date))}</span><span class="sub">${sub}</span></button>
    <button class="icon" data-act="day-next" aria-label="Nächster Tag">›</button></div>`;
  h += planHtml(date, day);
  if (day && day.entries.length) h += day.entries.map(e => cardHtml(date, e)).join('');
  else h += `<p class="empty">Für diesen Tag ist noch nichts eingetragen.</p>`;
  h += `<button class="add-ex" data-act="add-ex">+ Übung hinzufügen</button>`;
  if (day && day.tplId && tplById(day.tplId)) {
    const t = tplById(day.tplId), a = day.entries.map(e => e.exId).join('|'), b = t.items.map(i => i.exId).join('|');
    if (day.entries.length && a !== b) h += `<button class="sync-tpl" data-act="sync-tpl">Übungen dieses Tages in die Vorlage „${esc(t.name)}“ übernehmen</button>`;
  }
  return h;
}
function onboardHtml() {
  return `<div class="onboard"><h2 class="h">Dein Trainingslog</h2>
  <p class="hint">Mit dem Startpaket hast du sofort alles, was du in FitNotes hattest, plus Vorlagen und deinen Rhythmus:</p>
  <ul><li>23 Übungen, nach Kategorien sortiert und jeweils mit eigenem Gewichtsschritt</li>
  <li>Vorlagen Pull, Push, Legs, Upper, Lower und „Push (Schulter schonen)“</li>
  <li>Rhythmus Pull – Push – Legs – Ruhetag – Upper – Lower</li>
  <li>Deine Trainings vom 6. bis 11. November aus den Screenshots</li></ul>
  <div class="row-btns"><button class="primary" data-act="seed" data-hist="1">Startpaket laden</button><button class="ghost" data-act="skip-onboard">Leer starten</button></div>
  <p class="hint">Später kannst du unter „Daten“ auch deinen kompletten FitNotes-Verlauf als CSV importieren.</p></div>`;
}
function planHtml(date, day) {
  const tpls = S.cfg.templates;
  if (day && day.tplId) {
    return `<div class="plan"><div class="lbl"><small>Vorlage</small><strong>${esc(tplName(day.tplId))}</strong></div><button class="ghost sm" data-act="pick-tpl">Wechseln</button></div>`;
  }
  const sg = suggest(date);
  let h = '<div class="plan">';
  if (sg) {
    if (sg.item.type === 'rest') {
      const nx = nextNonRest(sg.idx);
      h += `<div class="lbl"><small>Laut Rhythmus</small><strong>Ruhetag</strong></div>`;
      if (nx) h += `<button class="ghost sm" data-act="start-tpl" data-tpl="${esc(nx.item.tplId)}" data-rot="${nx.idx}">Trotzdem ${esc(tplName(nx.item.tplId))}</button>`;
    } else {
      h += `<div class="lbl"><small>Laut Rhythmus</small><strong>${esc(tplName(sg.item.tplId))}</strong></div>`;
      h += `<button class="primary sm" data-act="start-tpl" data-tpl="${esc(sg.item.tplId)}" data-rot="${sg.idx}">Starten</button>`;
    }
  } else if (tpls.length) {
    h += `<div class="lbl"><small>Kein Rhythmus</small><a href="#vorlagen">Rhythmus festlegen</a></div>`;
  } else {
    h += `<div class="lbl"><small>Keine Vorlagen</small><a href="#vorlagen">Vorlage anlegen</a></div>`;
  }
  if (tpls.length) h += `<button class="ghost sm" data-act="pick-tpl">Andere Vorlage</button>`;
  return h + '</div>';
}
function draftFor(date, e) {
  const key = date + '|' + e.exId;
  if (S.drafts[key]) return S.drafts[key];
  let src = e.sets[e.sets.length - 1];
  if (!src) { const l = lastSession(e.exId, date); if (l) src = l.sets[0]; }
  return S.drafts[key] = {w: src ? fmtIn(src.w) : '', r: src ? String(src.r) : '', edit: null};
}
function cardHtml(date, e) {
  const ex = exById(e.exId), key = date + '|' + e.exId, dr = draftFor(date, e);
  const last = lastSession(e.exId, date), best = bestBefore(e.exId, date);
  let running = best;
  const setsHtml = e.sets.map((s, j) => {
    const v = e1rm(s.w, s.r), pr = best > 0 && v > running + 1e-9;
    if (v > running) running = v;
    return `<li class="set${dr.edit === j ? ' sel' : ''}" data-act="edit-set" data-i="${j}"><span class="n">${j + 1}</span>${pr ? '<span class="pr" title="Neuer Rekord beim geschätzten 1RM">PR</span>' : ''}<span class="sw"><b>${num(s.w)}</b> kg</span><span class="sr"><b>${s.r}</b> Wdh.</span></li>`;
  }).join('');
  const tgt = e.target ? `<span class="badge${e.sets.length >= e.target ? ' done' : ''}">${e.sets.length}/${e.target} Sätze</span>` : '';
  const editing = dr.edit != null;
  return `<article class="card" data-ex="${esc(e.exId)}">
    <div class="card-h"><h3>${esc(ex ? ex.name : 'Gelöschte Übung')}<small>${esc(ex ? catName(ex.catId) : '')}</small></h3>${tgt}${ex ? `<button class="x hb" data-act="go-hist" data-ex="${esc(e.exId)}" data-from="training" aria-label="Verlauf von ${esc(ex.name)} anzeigen" title="Verlauf">${CHART_ICON}</button>` : ''}<button class="x" data-act="rm-entry" aria-label="Übung von diesem Tag entfernen">×</button></div>
    ${last ? `<div class="last">Letztes Mal, ${esc(fmtShort(last.date))}: <b>${last.sets.map(s => num(s.w) + ' × ' + s.r).join(' · ')}</b></div>` : ''}
    <div class="steps">
      <div class="stp"><label for="w-${esc(e.exId)}">Gewicht (kg)</label><div class="row"><button data-act="w-" aria-label="Gewicht verringern">−</button><input id="w-${esc(e.exId)}" data-f="w" inputmode="decimal" autocomplete="off" value="${esc(dr.w)}"><button data-act="w+" aria-label="Gewicht erhöhen">+</button></div></div>
      <div class="stp"><label for="r-${esc(e.exId)}">Wiederholungen</label><div class="row"><button data-act="r-" aria-label="Wiederholungen verringern">−</button><input id="r-${esc(e.exId)}" data-f="r" inputmode="numeric" autocomplete="off" value="${esc(dr.r)}"><button data-act="r+" aria-label="Wiederholungen erhöhen">+</button></div></div>
    </div>
    <p class="err">${esc(S.errs[key] || '')}</p>

/* Seitenleiste */
function sideHtml(scope, counter) {
  const sel = S.catSel[scope];
  const cats = S.cfg.categories.slice().sort(byName);
  const all = counter(null);
  let h = `<aside class="side" aria-label="Kategorien"><button class="${sel === '__all' ? 'on' : ''}" data-act="side" data-scope="${scope}" data-cat="__all">Alle <span class="cnt">${all}</span></button>`;
  for (const c of cats) h += `<button class="${sel === c.id ? 'on' : ''}" data-act="side" data-scope="${scope}" data-cat="${esc(c.id)}">${esc(c.name)} <span class="cnt">${counter(c.id)}</span></button>`;
  if (S.cfg.exercises.some(e => !catById(e.catId))) h += `<button class="${sel === '__none' ? 'on' : ''}" data-act="side" data-scope="${scope}" data-cat="__none">Ohne Kategorie <span class="cnt">${counter('__none')}</span></button>`;
  if (scope === 'uebungen') h += `<button class="add" data-act="cat-add">+ Kategorie</button>`;
  return h + '</aside>';
}
const inCat = (e, c) => c === '__all' || c === null ? true : c === '__none' ? !catById(e.catId) : e.catId === c;

/* Übungen */
function renderExercises() {
  const sel = S.catSel.uebungen;

  const row = e => { const n = sessions(e.id).length; return `<div class="item-row"><button class="item${e.archived ? ' off' : ''}" data-act="edit-ex" data-ex="${esc(e.id)}"><span class="nm">${esc(e.name)}</span><span class="meta">${sel === '__all' ? esc(catName(e.catId)) + ' · ' : ''}Schritt ${num(e.step)} kg · ${n} Training${n === 1 ? '' : 's'}</span></button><button class="hist-btn" data-act="go-hist" data-ex="${esc(e.id)}" data-from="uebungen" aria-label="Verlauf von ${esc(e.name)} anzeigen" title="Verlauf">${CHART_ICON}</button></div>`; };
  let c = `<div class="sh"><h2 class="h">${esc(cat ? cat.name : sel === '__none' ? 'Ohne Kategorie' : 'Alle Übungen')}</h2><button class="primary sm" data-act="ex-new">+ Neue Übung</button></div>`;

  return `<div class="split">${sideHtml('uebungen', counter)}<section class="col">${c}</section></div>`;
}

/* Vorlagen */

/* Verlauf */
function renderHistory() {
  const sel = S.catSel.verlauf;
  const cnt = {}; for (const e of S.cfg.exercises) cnt[e.id] = sessions(e.id).length;
  const counter = c => S.cfg.exercises.filter(e => inCat(e, c) && cnt[e.id] > 0).length;
  const exs = S.cfg.exercises.filter(e => inCat(e, sel) && cnt[e.id] > 0).sort(byName);
  if (!S.histEx || !exById(S.histEx)) {
    const d = sortedDays().reverse().find(d => d.entries.some(e => e.sets.length));
    S.histEx = d ? d.entries.find(e => e.sets.length).exId : (exs[0] && exs[0].id) || null;
  }
  let c = '';
  if (!S.cfg.exercises.length) c = `<p class="empty">Noch keine Übungen. Lege sie unter „Übungen“ an oder lade unter „Daten“ das Startpaket.</p>`;
  else {
    const many = exs.length > 12;
    if (many) { const opts = exs.some(e => e.id === S.histEx) || !exById(S.histEx) ? exs : [exById(S.histEx), ...exs];
      c += `<div class="field"><label for="hist-sel">Übung</label><select id="hist-sel">${opts.map(e => `<option value="${esc(e.id)}"${e.id === S.histEx ? ' selected' : ''}>${esc(e.name)}</option>`).join('')}</select></div>`; }
    else c += exs.length ? `<div class="chips" aria-label="Übung wählen">${exs.map(e => `<button class="${e.id === S.histEx ? 'on' : ''}" data-act="hist-ex" data-ex="${esc(e.id)}">${esc(e.name)}</button>`).join('')}</div>` : `<p class="empty">In dieser Kategorie hast du noch nichts trainiert.</p>`;
    if (S.histEx && (sel === '__all' || exs.some(e => e.id === S.histEx))) c += histDetail(S.histEx);
  }
  return `<div class="split">${sideHtml('verlauf', counter)}<section class="col">${c}</section></div>`;
}
function histDetail(exId) {
  const ex = exById(exId), ss = sessions(exId);
  let h = S.histFrom === 'training' ? `<button class="back" data-act="hist-back">← Zurück zum Training</button>` : S.histFrom === 'uebungen' ? `<button class="back" data-act="hist-back">← Zurück zu den Übungen</button>` : '';
  h += `<h2 class="h">${esc(ex.name)}</h2>`;
  if (!ss.length) return h + `<p class="empty">Noch keine Einträge für diese Übung.</p>`;
  const bE = ss.reduce((a, b) => b.e1rm > a.e1rm ? b : a), bW = ss.reduce((a, b) => b.maxW > a.maxW ? b : a);
  h += `<div class="tiles">
    <div class="tile"><div class="l">1RM (gesch.)</div><div class="v">${num(bE.e1rm, 1)} <small>kg</small></div><div class="s">${esc(fmtTile(bE.date))}</div></div>
    <div class="tile"><div class="l">Max. Gewicht</div><div class="v">${num(bW.maxW)} <small>kg</small></div><div class="s">${esc(fmtTile(bW.date))}</div></div>
    <div class="tile"><div class="l">Trainings</div><div class="v">${ss.length}</div><div class="s">seit ${esc(fmtTile(ss[ss.length - 1].date))}</div></div></div>`;
  h += `<div class="seg" role="group" aria-label="Wert im Graph">${Object.entries(METRICS).map(([k, m]) => `<button class="${S.metric === k ? 'on' : ''}" data-act="metric" data-m="${k}">${m.label}</button>`).join('')}</div>`;
  h += `<div class="chart" id="chart"></div>`;
  h += `<p class="hint">Geschätztes 1RM nach Epley: Gewicht × (1 + Wdh. ÷ 30), bester Satz des Tages. Volumen: Summe aus Gewicht × Wdh. Tippe auf eine Zeile, um den Tag zu öffnen.</p>`;
  h += `<div class="tbl"><table><thead><tr><th>Datum</th><th>Sätze (kg × Wdh.)</th><th class="num">1RM</th><th class="num wide">Max.</th><th class="num wide">Volumen</th></tr></thead><tbody>${ss.map(s => `<tr data-act="goto-day" data-date="${s.date}"><td>${fmtTbl(s.date)}</td><td>${s.sets.map(x => num(x.w) + '&nbsp;×&nbsp;' + x.r).join(' · ')}</td><td class="num">${num(s.e1rm, 1)}</td><td class="num wide">${num(s.maxW)}</td><td class="num wide">${num(s.vol, 0)}</td></tr>`).join('')}</tbody></table></div>`;
  return h;
}
function niceTicks(min, max, n) {
  if (min === max) { const d = Math.abs(min) * 0.1 || 1; min -= d; max += d; }
  const span = max - min; min = Math.max(0, min - span * 0.1); max += span * 0.1;
  const raw = (max - min) / n, p = 10 ** Math.floor(Math.log10(raw)), f = raw / p;
  const step = (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p;
  const a = Math.floor(min / step) * step, b = Math.ceil(max / step) * step, out = [];
  for (let v = a; v <= b + step * 1e-6; v += step) out.push(Math.round(v * 1000) / 1000);
  return out;
}
function drawChart() {
  const wrap = $('#chart'); if (!wrap || !S.histEx) return;
  const m = METRICS[S.metric], ex = exById(S.histEx);
  const pts = sessions(S.histEx).slice().reverse().map(s => ({date:s.date, t:parseDs(s.date).getTime(), v:m.get(s), s})).filter(p => p.v > 0);
  if (!pts.length) { wrap.innerHTML = '<p class="empty pad">Für diesen Wert gibt es noch keine Einträge.</p>'; return; }
  const W = Math.max(280, Math.round(wrap.clientWidth - 8)), H = 240, L = 46, R = 22, T = 26, B = 30;
  let t0 = pts[0].t, t1 = pts[pts.length - 1].t;
  if (t1 - t0 < 864e5) { t0 -= 3 * 864e5; t1 += 3 * 864e5; }
  const vals = pts.map(p => p.v), ticks = niceTicks(Math.min(...vals), Math.max(...vals), 4), y0 = ticks[0], y1 = ticks[ticks.length - 1];
  const X = t => L + (t - t0) / (t1 - t0) * (W - L - R), Y = v => T + (1 - (v - y0) / ((y1 - y0) || 1)) * (H - T - B);
  let g = '';
  for (const tk of ticks) { const y = Y(tk).toFixed(1); g += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y}" y2="${y}"/><text class="axis" x="${L - 8}" y="${y}" text-anchor="end" dominant-baseline="middle">${num(tk, 1)}</text>`; }
  const spanDays = (pts[pts.length - 1].t - pts[0].t) / 864e5;
  const fx = p => parseDs(p.date).toLocaleDateString('de-DE', spanDays > 300 ? {day:'numeric', month:'numeric', year:'2-digit'} : {day:'numeric', month:'short'});
  const xl = pts.length === 1 ? [pts[0]] : (pts.length > 2 && W > 420 ? [pts[0], pts[Math.floor((pts.length - 1) / 2)], pts[pts.length - 1]] : [pts[0], pts[pts.length - 1]]);
  xl.forEach((p, i) => { const anc = xl.length === 1 ? 'middle' : i === 0 ? 'start' : i === xl.length - 1 ? 'end' : 'middle'; g += `<text class="axis" x="${X(p.t).toFixed(1)}" y="${H - 8}" text-anchor="${anc}">${esc(fx(p))}</text>`; });
  const line = pts.map((p, i) => (i ? 'L' : 'M') + X(p.t).toFixed(1) + ' ' + Y(p.v).toFixed(1)).join(' ');
  const base = Y(y0).toFixed(1);
  if (pts.length > 1) g += `<path class="ar" d="${line} L${X(pts[pts.length - 1].t).toFixed(1)} ${base} L${X(pts[0].t).toFixed(1)} ${base} Z"/><path class="ln" d="${line}"/>`;
  if (pts.length <= 60) g += pts.slice(0, -1).map(p => `<circle class="dot" cx="${X(p.t).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="4"/>`).join('');
  const lp = pts[pts.length - 1], lx = X(lp.t), ly = Y(lp.v);
  g += `<circle class="dot" cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="5.5"/><text class="endl" x="${lx.toFixed(1)}" y="${(ly - 12).toFixed(1)}" text-anchor="${lx > W - 70 ? 'end' : 'middle'}">${num(lp.v, m.dec)} ${m.unit}</text>`;
  g += `<line class="ch" id="ch" x1="0" x2="0" y1="${T}" y2="${H - B}" visibility="hidden"/><circle class="dot" id="chdot" r="6" visibility="hidden"/>`;
  wrap.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(m.label + ' für ' + ex.name + ', ' + pts.length + ' Trainings')}">${g}</svg><div class="tip"></div>`;
  const svg = wrap.querySelector('svg'), tip = wrap.querySelector('.tip'), ch = svg.querySelector('#ch'), cd = svg.querySelector('#chdot');
  const show = ev => {
    const r = svg.getBoundingClientRect(), px = (ev.clientX - r.left) * (W / r.width);
    let bi = 0, bd = Infinity; pts.forEach((p, i) => { const d = Math.abs(X(p.t) - px); if (d < bd) { bd = d; bi = i; } });
    const p = pts[bi], x = X(p.t), y = Y(p.v);
    ch.setAttribute('x1', x); ch.setAttribute('x2', x); ch.setAttribute('visibility', 'visible');
    cd.setAttribute('cx', x); cd.setAttribute('cy', y); cd.setAttribute('visibility', 'visible');
    tip.innerHTML = `<b>${esc(fmtShort(p.date))}</b> · ${esc(m.label)}: ${num(p.v, m.dec)} ${m.unit}<br><span>${p.s.sets.map(s => num(s.w) + ' × ' + s.r).join(' · ')}</span>`;
    tip.style.display = 'block';
    const sx = x * (r.width / W) + svg.offsetLeft, sy = y * (r.height / H) + svg.offsetTop;
    const half = tip.offsetWidth / 2 + 4;
    tip.style.left = Math.min(Math.max(sx, half), wrap.clientWidth - half) + 'px';
    tip.style.top = Math.max(sy - 12, tip.offsetHeight + 2) + 'px';
  };
  const hide = () => { tip.style.display = 'none'; ch.setAttribute('visibility', 'hidden'); cd.setAttribute('visibility', 'hidden'); };
  svg.addEventListener('pointermove', show); svg.addEventListener('pointerdown', show); svg.addEventListener('pointerleave', hide);
}
let rsT; window.addEventListener('resize', () => { clearTimeout(rsT); rsT = setTimeout(() => { if (S.view === 'verlauf') drawChart(); }, 150); });

/* Daten */

/* ---------- Import: FitNotes backup (.fitnotes) or CSV ---------- */
async function importFile(file, onProg) {
  const buf = new Uint8Array(await file.arrayBuffer());
  if (buf.length > 16 && String.fromCharCode(...buf.slice(0, 15)) === 'SQLite format 3') return importFitnotesDb(buf, onProg);
  return importCSV(new TextDecoder('utf-8').decode(buf), onProg);
}
async function loadSqlJs() {
  if (!window.initSqlJs) await new Promise((res, rej) => { const s = document.createElement('script'); s.src = SQLJS_BASE + 'sql-wasm.js'; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
  return window.initSqlJs({locateFile:f => SQLJS_BASE + f});
}
async function importFitnotesDb(buf, onProg) {
  let SQL; try { SQL = await loadSqlJs(); } catch (e) { throw new Error(WT.errSqlLoad); }
  let db; try { db = new SQL.Database(buf); } catch (e) { throw new Error(WT.errNotFitnotes); }
  const q = sql => { try { const r = db.exec(sql); return r.length ? r[0].values : []; } catch (e) { return null; } };
  const tl = q('SELECT t.date, e.name, c.name, t.metric_weight, t.reps FROM training_log t JOIN exercise e ON e._id = t.exercise_id LEFT JOIN Category c ON c._id = e.category_id WHERE t.reps > 0 ORDER BY t.date, t._id');
  if (tl === null) { db.close(); throw new Error(WT.errNotFitnotes); }
  const items = tl.map(([d, n, c, w, r]) => ({date:String(d).slice(0, 10), name:String(n || '').trim(), cat:c ? String(c).trim() : '', w:Math.round((+w || 0) * 100) / 100, r:+r}));
  const weights = [];
  for (const [d, v, cmt] of (q('SELECT date, body_weight_metric, comments FROM BodyWeight ORDER BY date') || [])) weights.push({date:String(d).slice(0, 10), w:+v, note:cmt || ''});
  for (const [d, v, cmt, u] of (q("SELECT r.date, r.value, r.comment, u.short_name FROM MeasurementRecord r JOIN Measurement m ON m._id = r.measurement_id LEFT JOIN MeasurementUnit u ON u._id = m.unit_id WHERE lower(m.name) IN ('bodyweight', 'body weight') ORDER BY r.date, r.time") || [])) weights.push({date:String(d).slice(0, 10), w:/lb/i.test(u || '') ? +v * 0.45359237 : +v, note:cmt || ''});
  db.close();
  return applyImport(items, weights, onProg);
}
async function importCSV(text, onProg) {
  const rows = parseCSV(text);
  if (rows.length < 2) throw new Error(WT.errEmpty);
  const hd = rows[0].map(h => low(h));
  const fi = re => hd.findIndex(h => re.test(h));
  const iD = fi(/^(date|datum)/), iE = fi(/^(exercise|übung|uebung)/), iC = fi(/^(category|kategorie)/), iW = fi(/^(weight|gewicht)(?!.*(unit|einheit))/), iU = fi(/(weight unit|gewichtseinheit|^unit$|^einheit$)/), iR = fi(/^(reps|wdh|wiederholungen)/);
  const iBW = fi(/(body ?weight|körpergewicht)/), iM = fi(/^(measurement|messung)/), iV = fi(/^(value|wert)$/), iN = fi(/^(comment|comments|notiz|note|notes)$/);
  const isWorkout = iD >= 0 && iE >= 0 && iW >= 0 && iR >= 0;
  const bwCol = iBW >= 0 ? iBW : (!isWorkout && iE < 0 && iM < 0 && iW >= 0 ? iW : -1);
  const items = [], weights = [];
  for (const r of rows.slice(1)) {
    const date = iD >= 0 ? parseDateAny((r[iD] || '').trim()) : null; if (!date) continue;
    const lbs = iU >= 0 && /lb/.test(low(r[iU]));
    if (isWorkout) {
      const name = (r[iE] || '').trim(), reps = parseInt(r[iR], 10);
      if (name && reps > 0) { let w = parseNum(r[iW]); if (!isFinite(w)) w = 0; if (/lb/.test(hd[iW]) || lbs) w *= 0.45359237; items.push({date, name, cat:iC >= 0 ? (r[iC] || '').trim() : '', w:Math.round(w * 100) / 100, r:reps}); }
    }
    let bw = NaN;
    if (bwCol >= 0) bw = parseNum(r[bwCol]);
    else if (iM >= 0 && iV >= 0 && /(body ?weight|körpergewicht)/.test(low(r[iM]))) bw = parseNum(r[iV]);
    if (bw > 0) weights.push({date, w:(lbs || /lb/.test(hd[bwCol] || '')) ? bw * 0.45359237 : bw, note:iN >= 0 ? (r[iN] || '') : ''});
  }
  if (!isWorkout && !weights.length) throw new Error(WT.errCols);
  return applyImport(items, weights, onProg);
}
async function applyImport(items, weights, onProg) {
  const byDate = {}; let nSets = 0; const created = new Set();
  for (const it of items) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(it.date) || !it.name || !(it.r > 0)) continue;
    let ex = findEx(it.name) || seedMatch(it.name);
    if (!ex) { ex = {id:newId(), name:it.name, catId:getOrCreateCat(catFor(it.cat)), step:2.5, repStep:1, aliases:[], archived:false}; S.cfg.exercises.push(ex); created.add(ex.id); }
    const dd = byDate[it.date] || (byDate[it.date] = {});
    (dd[ex.id] || (dd[ex.id] = [])).push({w:it.w, r:it.r}); nSets++;
  }
  const dates = Object.keys(byDate).sort();
  for (const d of dates) {
    const day = ensureDay(d);
    for (const [exId, sets] of Object.entries(byDate[d])) { const e = day.entries.find(x => x.exId === exId); if (e) e.sets = sets; else day.entries.push({exId, target:0, sets}); }
  }
  const wDates = new Set();
  for (const w of weights) { if (/^\d{4}-\d{2}-\d{2}$/.test(w.date) && w.w > 0 && w.w < 500) { S.weights[w.date] = {w:Math.round(w.w * 100) / 100, note:String(w.note || '').trim()}; wDates.add(w.date); } }
  if (!dates.length && !wDates.size) throw new Error(WT.errNone);
  if (dates.length || created.size) saveCfg();
  if (wDates.size) { saveWeights(); S.wDraft = null; }
  await writeDaysNow(dates, onProg);
  return {days:dates.length, sets:nSets, created:created.size, weights:wDates.size};
}

      Modal.close();
      if (after) after(nid); else { toast(id ? 'Übung gespeichert.' : 'Übung angelegt.'); render(); }
      break;
    }
    case 'ex-archive': { const ex = exById(S.exEdit.id); ex.archived = !ex.archived; saveCfg(); Modal.close(); render(); toast(ex.archived ? 'Übung ausgeblendet.' : 'Übung wieder eingeblendet.'); break; }
    case 'ex-delete': {
      const id = S.exEdit.id;
      S.cfg.exercises = S.cfg.exercises.filter(e => e.id !== id);
      S.cfg.templates.forEach(t => { t.items = t.items.filter(x => x.exId !== id); });
      const touched = Object.values(S.days).filter(d => d.entries.some(e => e.exId === id));
      touched.forEach(d => { d.entries = d.entries.filter(e => e.exId !== id); saveDay(d.date); });
      saveCfg(); Modal.close(); render(); toast('Übung gelöscht.');
      break;
    }
    case 'hist-ex': S.histEx = el.dataset.ex; render(); break;
    case 'go-hist': {
      const id = el.dataset.ex; if (!exById(id)) return;
      if (!$('#modal').hidden) Modal.close();
      S.histEx = id; S.histFrom = el.dataset.from || null;
      const ex = exById(id);
      S.catSel.verlauf = sessions(id).length && catById(ex.catId) ? ex.catId : '__all';
      if (location.hash === '#verlauf') render(); else location.hash = '#verlauf';
      window.scrollTo(0, 0);
      break;
    }
    case 'hist-back': { const to = S.histFrom === 'uebungen' ? '#uebungen' : '#training'; S.histFrom = null; location.hash = to; break; }
    case 'metric': S.metric = el.dataset.m; render(); break;
    case 'goto-day': S.date = el.dataset.date; if (location.hash === '#training') render(); else location.hash = '#training'; window.scrollTo(0, 0); break;
    case 'rot-up': case 'rot-down': { const r = S.cfg.rotation, j = a === 'rot-up' ? i - 1 : i + 1; if (j < 0 || j >= r.length) return; [r[i], r[j]] = [r[j], r[i]]; saveCfg(); render(); break; }
    case 'rot-rm': S.cfg.rotation.splice(i, 1); saveCfg(); render(); break;
    case 'tpl-new': { const t = {id:newId(), name:'Neue Vorlage', items:[]}; S.cfg.templates.push(t); S.tplEdit = t.id; saveCfg(); render(); const n = $('#tpl-name'); if (n) { n.focus(); n.select(); } break; }
    case 'tpl-edit': S.tplEdit = el.dataset.tpl; render(); break;
    case 'tpl-done': { const t = tplById(S.tplEdit); if (t && !t.name.trim()) { t.name = 'Vorlage'; saveCfg(); } S.tplEdit = null; render(); break; }
    case 'tpl-del': {
      const t = tplById(S.tplEdit); if (!t) return;
      if (!(await confirmDlg(`Vorlage „${t.name}“ löschen? Sie wird auch aus dem Rhythmus entfernt. Deine Trainings bleiben erhalten.`, 'Löschen', true))) return;
      Modal.close();
      S.cfg.templates = S.cfg.templates.filter(x => x.id !== t.id); S.cfg.rotation = S.cfg.rotation.filter(x => x.tplId !== t.id); S.tplEdit = null;
      saveCfg(); render();
      break;
    }
    case 'ti-sets-': case 'ti-sets+': { const t = tplById(S.tplEdit); const it = t.items[i]; it.sets = Math.max(1, Math.min(20, it.sets + (a.endsWith('+') ? 1 : -1))); saveCfg(); render(); break; }
    case 'ti-up': case 'ti-down': { const t = tplById(S.tplEdit), r = t.items, j = a === 'ti-up' ? i - 1 : i + 1; if (j < 0 || j >= r.length) return; [r[i], r[j]] = [r[j], r[i]]; saveCfg(); render(); break; }
    case 'ti-rm': { const t = tplById(S.tplEdit); t.items.splice(i, 1); saveCfg(); render(); break; }
    case 'ti-add': {
      const t = tplById(S.tplEdit); if (!t) return;
      openPicker('Übung zur Vorlage', exId => { const tt = tplById(S.tplEdit); if (tt && !tt.items.some(x => x.exId === exId)) tt.items.push({exId, sets:2}); saveCfg(); Modal.close(); render(); }, t.items.map(x => x.exId));
      break;
    }
    case 'backup-download': {
      const txt = JSON.stringify({app:'trainingslog', v:1, exported:new Date().toISOString(), cfg:S.cfg, days:S.days, weights:S.weights});
      const url = URL.createObjectURL(new Blob([txt], {type:'application/json'}));
      const dl = document.createElement('a'); dl.href = url; dl.download = 'trainingslog-backup-' + today() + '.json';
      document.body.appendChild(dl); dl.click(); dl.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000);
      toast('Backup wird heruntergeladen.');
      break;
    }
    case 'backup-copy': {
      const txt = JSON.stringify({app:'trainingslog', v:1, exported:new Date().toISOString(), cfg:S.cfg, days:S.days, weights:S.weights});
      try { await navigator.clipboard.writeText(txt); toast('Backup in die Zwischenablage kopiert.'); }
      catch (e) { const ta = $('#backup-in'); ta.value = txt; ta.focus(); ta.select(); $('#bk-status').textContent = 'Kopieren ging nicht automatisch. Der Text ist unten markiert, kopiere ihn von Hand.'; }
      break;
    }
    case 'backup-restore': {
      const st = $('#bk-status'); let o;
      try { o = JSON.parse($('#backup-in').value); } catch (e) { st.textContent = 'Das ist kein gültiges Backup. Füge den kompletten kopierten Text ein.'; return; }
      if (!o || o.app !== 'trainingslog' || !o.cfg) { st.textContent = 'Das ist kein gültiges Backup dieser App.'; return; }
      if (!(await confirmDlg('Alle aktuellen Übungen, Vorlagen und Trainings werden durch das Backup ersetzt.', 'Ersetzen', true))) return;
      Modal.close();
      const old = Object.keys(S.days);
      S.cfg = normCfg(o.cfg); S.days = {}; S.weights = o.weights ? normWeights(o.weights) : (S.weights || {}); S.wDraft = null;
      for (const k in (o.days || {})) { if (/^\d{4}-\d{2}-\d{2}$/.test(k)) { const d = normDay(o.days[k], k); if (!isEmptyDay(d)) S.days[k] = d; } }
      saveCfg(); render();
      const all = [...new Set([...old, ...Object.keys(S.days)])].sort();
      try { await writeDaysNow(all, (k, n) => { const s = $('#bk-status'); if (s) s.textContent = `Speichere ${k} von ${n} Tagen …`; }); toast('Backup wiederhergestellt.'); }
      catch (e) { onWriteError(e); }
      render();
      break;
    }
  }
});

document.addEventListener('input', ev => {
  const t = ev.target;
  if (t.dataset && t.dataset.f) {
    const c = cardCtx(t); if (!c || !c.dr) return;
    c.dr[t.dataset.f] = t.value; if (S.errs[c.key]) setErr(c, '');
  } else if (t.id === 'pk-q' && S.picker) { S.picker.q = t.value; renderPicker(); }
  else if (t.id === 'tpl-name') { const tp = tplById(t.dataset.tpl); if (tp) { tp.name = t.value; saveCfg(); } }
});
document.addEventListener('change', async ev => {
  const t = ev.target;
  if (t.id === 'hist-sel') { S.histEx = t.value; render(); }
  else if (t.id === 'rot-add' && t.value) { S.cfg.rotation.push(t.value === '__rest' ? {type:'rest'} : {type:'t', tplId:t.value}); saveCfg(); render(); }
  else if (t.id === 'ex-cat') { $('#ex-newcat-f').hidden = t.value !== '__new'; }
  else if (t.id === 'backup-file' && t.files && t.files[0]) {
    try { $('#backup-in').value = await t.files[0].text(); $('#bk-status').textContent = 'Backup geladen. Tippe auf „Wiederherstellen und alles ersetzen“, um es zu übernehmen.'; }
    catch (e) { $('#bk-status').textContent = 'Die Datei konnte nicht gelesen werden.'; }
  }
  else if (t.id === 'tpl-name' && !t.value.trim()) { const tp = tplById(t.dataset.tpl); if (tp) { tp.name = 'Vorlage'; t.value = 'Vorlage'; saveCfg(); } }
  else if (t.id === 'csv-file' && t.files && t.files[0]) {
    const st = $('#imp-status'); st.textContent = 'Lese Datei …';
    try {
      const res = await importFile(t.files[0], (k, n) => { const s = $('#imp-status'); if (s) s.textContent = `Speichere ${k} von ${n} Tagen …`; });
      S.skipOnboard = true; render();
      const s2 = $('#imp-status'); if (s2) s2.textContent = WT.impDone(res);
      toast('FitNotes-Import abgeschlossen.');
    } catch (e) { const s = $('#imp-status'); if (s) s.textContent = (e && e.message) || 'Der Import hat nicht geklappt.'; if (e && e.code) onWriteError(e); }
  }
});
document.addEventListener('keydown', ev => {
  const t = ev.target;
  if (ev.key === 'Enter' && t.dataset && t.dataset.f) { ev.preventDefault(); const c = t.closest('.card'); const b = c && c.querySelector('[data-act="save-set"]'); if (b) b.click(); }
  else if (ev.key === 'Enter' && t.id === 'td-in') { ev.preventDefault(); const b = document.querySelector('[data-act="td-ok"]'); if (b) b.click(); }
  else if (ev.key === 'Escape' && !$('#modal').hidden) Modal.close();
});

/* ---------- Navigation ---------- */
const VIEWS = ['training', 'verlauf', 'uebungen', 'vorlagen', 'daten', WEIGHT_VIEW];
function fromHash() { const h = location.hash.slice(1); S.view = VIEWS.includes(h) ? h : 'training'; }
window.addEventListener('hashchange', () => { fromHash(); if (S.view === WEIGHT_VIEW) S.wDraft = null; S.tplEdit = null; if (S.view !== 'verlauf') S.histFrom = null; render(); window.scrollTo(0, 0); });
fromHash();
window.addEventListener('online', setSync); window.addEventListener('offline', setSync);
Store.init();
</script>
</body>
</html>
