<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Training Log</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#192025" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Training Log">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: one column up to 760px, tabs on top; Exercises and History with a category sidebar on the left */
  --bg:#eef1f4; --surface:#ffffff; --surface-2:#e5eaef; --ink:#13202a; --muted:#566573; --line:#d2dae1;
  --accent:#1b74b8; --accent-ink:#ffffff; --accent-soft:#dbe9f5;
  --pr:#8f5c0e; --pr-soft:#f6e6c8; --danger:#b3361f; --danger-soft:#f7e0da; --ok:#2a8a52;
  --font-display:'Barlow Condensed','Arial Narrow',sans-serif;
  --font-body:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r:10px; color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#101417; --surface:#192025; --surface-2:#222a30; --ink:#e6ecf1; --muted:#95a3ae; --line:#2c353c;
    --accent:#45a6ea; --accent-ink:#06121b; --accent-soft:#15324a;
    --pr:#f0b54e; --pr-soft:#3d2e12; --danger:#f17a63; --danger-soft:#3e1f19; --ok:#5cc489; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101417; --surface:#192025; --surface-2:#222a30; --ink:#e6ecf1; --muted:#95a3ae; --line:#2c353c;
  --accent:#45a6ea; --accent-ink:#06121b; --accent-soft:#15324a;
  --pr:#f0b54e; --pr-soft:#3d2e12; --danger:#f17a63; --danger-soft:#3e1f19; --ok:#5cc489; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--font-body);-webkit-tap-highlight-color:transparent}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default;opacity:.45}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
h2,h3{text-wrap:balance}

.top{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{max-width:760px;margin:0 auto;padding:10px 16px 2px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--font-display);font-weight:700;font-size:1.4rem;letter-spacing:.04em;text-transform:uppercase}
.brand span{color:var(--accent)}
.sync{font-size:.8rem;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync.ok::before{background:var(--ok)} .sync.saving::before{background:var(--accent)} .sync.err::before,.sync.warn::before{background:var(--danger)}
.tabs{max-width:760px;margin:0 auto;padding:0 8px;display:flex;overflow-x:auto;scrollbar-width:none}
.tabs a{flex:1 0 auto;text-align:center;padding:10px 8px 9px;color:var(--muted);text-decoration:none;font-weight:600;font-size:.95rem;border-bottom:3px solid transparent}
.tabs a.on{color:var(--accent);border-bottom-color:var(--accent)}
main{max-width:760px;margin:0 auto;padding:16px 16px 96px;display:flex;flex-direction:column;gap:14px}

.h{font-family:var(--font-display);font-size:1.45rem;font-weight:600;margin:0;text-transform:uppercase;letter-spacing:.03em}
.sh{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.hint{font-size:.88rem;color:var(--muted);margin:0}
.empty{color:var(--muted);margin:0;font-size:.95rem}
.pad{padding:12px 14px}
.note{background:var(--danger-soft);color:var(--danger);border-radius:var(--r);padding:10px 14px;font-size:.9rem}

.primary,.ghost,.danger{border-radius:8px;padding:10px 16px;font-weight:600;border:1px solid transparent}
.primary{background:var(--accent);color:var(--accent-ink)}
.ghost{background:var(--surface);border-color:var(--line);color:var(--ink)}
.danger{background:var(--danger-soft);color:var(--danger)}
.sm{padding:7px 12px;font-size:.9rem}
.row-btns{display:flex;gap:8px;flex-wrap:wrap}
.row-btns .primary{flex:1}

.daynav{display:grid;grid-template-columns:52px 1fr 52px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.daynav .icon{height:58px;border:0;background:none;font-size:2rem;line-height:1;color:var(--accent)}
.dtitle{border:0;background:none;padding:6px;display:flex;flex-direction:column;align-items:center;min-width:0}
.dtitle .d{font-family:var(--font-display);font-size:clamp(1.1rem,5vw,1.4rem);font-weight:600;text-transform:uppercase;letter-spacing:.03em;text-align:center}
.dtitle .sub{font-size:.8rem;color:var(--muted)}

.plan{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:12px 14px;background:var(--accent-soft);border-radius:var(--r)}
.plan .lbl{display:flex;flex-direction:column;margin-right:auto;min-width:0}
.plan .lbl small{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.plan .lbl strong{font-family:var(--font-display);font-size:1.45rem;font-weight:600;line-height:1.15}
.plan a{color:var(--accent);font-weight:600}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.card-h{display:flex;align-items:center;gap:8px;padding:10px 8px 8px 14px;border-bottom:2px solid var(--accent)}
.card-h h3{margin:0;font-family:var(--font-display);font-size:1.32rem;font-weight:600;flex:1;min-width:0;overflow-wrap:anywhere;line-height:1.15}
.card-h h3 small{display:block;font-family:var(--font-body);font-size:.75rem;font-weight:500;color:var(--muted)}
.badge{font-size:.78rem;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.badge.done{background:var(--accent-soft);color:var(--accent)}
.x{border:0;background:none;color:var(--muted);font-size:1.35rem;width:38px;height:38px;border-radius:8px;flex:none}
.last{padding:8px 14px 0;font-size:.85rem;color:var(--muted)}
.last b{color:var(--ink);font-weight:600}
.steps{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:10px 14px}
.stp label{display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;margin-bottom:4px}
.stp .row{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface-2)}
.stp .row button{border:0;background:none;font-size:1.6rem;line-height:1;color:var(--accent);height:50px}
.stp input{width:100%;min-width:0;border:0;border-left:1px solid var(--line);border-right:1px solid var(--line);background:var(--surface);text-align:center;font-family:var(--font-display);font-size:1.6rem;font-weight:600;font-variant-numeric:tabular-nums;padding:0}
.card-a{display:flex;gap:8px;padding:0 14px 12px;flex-wrap:wrap}
.card-a .primary{flex:1}
.err{color:var(--danger);font-size:.85rem;margin:0;padding:0 14px 8px}
.err:empty{display:none}
.sets{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.set{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--line);cursor:pointer;font-variant-numeric:tabular-nums}
.set:last-child{border-bottom:0}
.set.sel{background:var(--accent-soft)}
.set .n{color:var(--muted);font-size:.85rem;width:1.4em}
.set b{font-family:var(--font-display);font-size:1.3rem;font-weight:600}
.set .sw{margin-left:auto;min-width:6em;text-align:right}
.set .sr{min-width:5.5em;text-align:right}
.pr{font-size:.7rem;font-weight:700;letter-spacing:.04em;background:var(--pr-soft);color:var(--pr);padding:2px 6px;border-radius:4px}
.add-ex{border:2px dashed var(--line);background:none;border-radius:var(--r);padding:14px;font-weight:600;color:var(--accent)}
.sync-tpl{border:0;background:none;color:var(--accent);font-weight:600;padding:4px 0;text-align:left}

.split{display:grid;grid-template-columns:150px minmax(0,1fr);gap:14px;align-items:start}
.side{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;position:sticky;top:100px}
.side button{border:0;border-left:3px solid transparent;border-bottom:1px solid var(--line);border-radius:0;background:none;text-align:left;padding:11px 10px 11px 11px;display:flex;justify-content:space-between;align-items:baseline;gap:6px;font-weight:600;font-size:.92rem;overflow-wrap:anywhere}
.side button:last-child{border-bottom:0}
.side button.on{border-left-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.side .cnt{color:var(--muted);font-weight:400;font-size:.8rem;font-variant-numeric:tabular-nums}
.side .add{color:var(--accent)}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
@media (max-width:480px){
  .split{grid-template-columns:104px minmax(0,1fr);gap:10px}
  .side button{padding:10px 6px 10px 8px;font-size:.84rem}
  .steps{gap:8px;padding:10px 10px}
  .tiles{grid-template-columns:1fr 1fr;gap:8px}
  .tile{padding:8px 10px}
  .tile .v{font-size:1.35rem}
  .wide{display:none}
  td,th{padding:8px 8px}
}

.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.item{border:0;border-bottom:1px solid var(--line);background:none;text-align:left;padding:12px 14px;display:flex;flex-direction:column;gap:2px;width:100%}
.item:last-child{border-bottom:0}
.item .nm{font-weight:600}
.item .meta{font-size:.82rem;color:var(--muted)}
.item.off .nm{color:var(--muted)}
.grp{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;padding:10px 14px 4px;background:var(--surface-2)}

.chips,.seg{display:flex;flex-wrap:wrap;gap:6px}
.chips button,.seg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.88rem;font-weight:600;color:var(--muted)}
.chips button.on,.seg button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.tile .l{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.tile .v{font-family:var(--font-display);font-size:1.65rem;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}
.tile .v small{font-size:.9rem;color:var(--muted);font-weight:500}
.tile .s{font-size:.8rem;color:var(--muted)}

.chart{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 4px 2px}
.chart svg{display:block;width:100%;height:auto;touch-action:pan-y}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .axis{fill:var(--muted);font-size:11px;font-family:var(--font-body)}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .ar{fill:var(--accent);fill-opacity:.12}
.chart .dot{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.chart .endl{fill:var(--ink);font-weight:700;font-size:12px;font-family:var(--font-body)}
.chart .ch{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);padding:6px 10px;border-radius:6px;font-size:.8rem;line-height:1.4;white-space:nowrap;transform:translate(-50%,-100%);display:none;z-index:2}
.tip span{opacity:.85}

.tbl{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:.9rem}
th{text-align:left;font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;font-weight:600}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
.num{text-align:right;white-space:nowrap}
tr[data-act]{cursor:pointer}
tr[data-act]:hover td{background:var(--surface-2)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.panel h2{margin:0;font-family:var(--font-display);font-size:1.35rem;font-weight:600}
.field label{display:block;font-size:.8rem;font-weight:600;color:var(--muted);margin-bottom:4px}
.field input,.field select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}
textarea{min-height:90px;font-family:ui-monospace,monospace;font-size:.8rem}
.mt{margin-top:8px}
.check{display:flex;gap:8px;align-items:flex-start;font-size:.92rem}
.check input{margin-top:4px}

.rot{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.rot li{display:flex;align-items:center;flex-wrap:wrap;gap:6px;padding:7px 8px 7px 12px;border-bottom:1px solid var(--line)}
.rot li:last-child{border-bottom:0}
.rot .n{color:var(--muted);font-size:.85rem;width:1.4em;font-variant-numeric:tabular-nums}
.rot .nm{flex:1 1 120px;font-weight:600;min-width:0;overflow-wrap:anywhere}
.rot li.rest .nm{color:var(--muted);font-style:italic}
.rot li.next{background:var(--accent-soft)}
.mini{border:1px solid var(--line);background:var(--surface);border-radius:6px;min-width:36px;height:36px;color:var(--muted);font-weight:600}
.ms{display:flex;align-items:center;gap:6px;font-size:.88rem;color:var(--muted);font-variant-numeric:tabular-nums}
.tplrow{border:0;background:none;text-align:left;padding:12px 14px;display:flex;flex-direction:column;gap:3px;width:100%}
.tplrow .nm{font-family:var(--font-display);font-size:1.3rem;font-weight:600}
.tplrow .meta{font-size:.84rem;color:var(--muted)}

.onboard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:12px}
.onboard ul{margin:0;padding-left:1.2em;color:var(--muted);font-size:.92rem}

.modal{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.backdrop{position:absolute;inset:0;background:rgb(0 0 0 / .5)}
.sheet{position:relative;background:var(--surface);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px 24px;display:flex;flex-direction:column;gap:12px}
@media (min-width:640px){.modal{align-items:center}.sheet{border-radius:16px}}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sheet .list{max-height:44vh;overflow:auto}

#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:.92rem;opacity:0;pointer-events:none;z-index:30;max-width:calc(100% - 32px);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:no-preference){#toast{transition:opacity .2s,transform .2s}}
</style>
</head>
<body>
<header class="top">
  <div class="bar"><div class="brand">Training <span>log</span></div><div id="sync" class="sync">Connecting …</div></div>
  <nav class="tabs" aria-label="Sections">
    <a href="#workout">Workout</a>
    <a href="#history">History</a>
    <a href="#exercises">Exercises</a>
    <a href="#templates">Templates</a>
    <a href="#data">Data</a>
  </nav>
</header>
<main id="view"></main>
<div id="modal" class="modal" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
/* Standalone offline version: stores data on this device only (localStorage). */
const STANDALONE = true;
const LOCALE = 'en-GB';
if (STANDALONE && 'serviceWorker' in navigator) window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(() => {}); });
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
/* ---------- Helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const pad = n => String(n).padStart(2, '0');
const ds = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parseDs = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const today = () => ds(new Date());
const addDays = (s, n) => { const d = parseDs(s); d.setDate(d.getDate() + n); return ds(d); };
const daysBetween = (a, b) => Math.round((parseDs(b) - parseDs(a)) / 864e5);
const fmtLong = s => parseDs(s).toLocaleDateString(LOCALE, {weekday:'long', day:'numeric', month:'long'});
const fmtShort = s => parseDs(s).toLocaleDateString(LOCALE, {weekday:'short', day:'numeric', month:'short'});
const fmtTbl = s => parseDs(s).toLocaleDateString(LOCALE, {day:'2-digit', month:'2-digit', year:'2-digit'});
const num = (n, d = 2) => (Math.round(n * 10 ** d) / 10 ** d).toLocaleString(LOCALE, {maximumFractionDigits:d});
const fmtIn = n => (Math.round(n * 100) / 100).toLocaleString(LOCALE, {maximumFractionDigits:2, useGrouping:false});
const parseNum = v => { const n = parseFloat(String(v ?? '').trim().replace(',', '.')); return isFinite(n) ? n : NaN; };
const r2 = n => Math.round(n * 1000) / 1000;
const e1rm = (w, r) => r <= 0 ? 0 : (r === 1 ? w : w * (1 + r / 30));
const byName = (a, b) => a.name.localeCompare(b.name, 'en');
const low = s => String(s || '').trim().toLowerCase();
const plural = (n, one, many) => n + ' ' + (n === 1 ? one : many);

/* ---------- State ---------- */
const EMPTY_CFG = () => ({v:1, categories:[], exercises:[], templates:[], rotation:[]});
const S = {
  cfg: EMPTY_CFG(), days: {}, view: 'workout', date: today(),
  catSel: {exercises:'__all', history:'__all'}, histEx: null, metric: 'e1rm',
  drafts: {}, errs: {}, tplEdit: null, picker: null, exEdit: null,
  cfgConfirmed: false, netNote: null, skipOnboard: false, busy: false
};
function normCfg(c) {
  c = c && typeof c === 'object' ? c : {};
  const arr = x => Array.isArray(x) ? x : [];
  return {
    v: 1,
    categories: arr(c.categories).filter(x => x && x.id && x.name),
    exercises: arr(c.exercises).filter(x => x && x.id && x.name).map(x => ({id:x.id, name:String(x.name), catId:x.catId || null, step:+x.step > 0 ? +x.step : 2.5, repStep:+x.repStep >= 1 ? Math.round(+x.repStep) : 1, aliases:arr(x.aliases), archived:!!x.archived})),
    templates: arr(c.templates).filter(x => x && x.id).map(t => ({id:t.id, name:String(t.name || 'Template'), items:arr(t.items).filter(i => i && i.exId).map(i => ({exId:i.exId, sets:Math.max(1, Math.min(20, +i.sets || 2))}))})),
    rotation: arr(c.rotation).filter(x => x && (x.type === 'rest' || x.tplId)).map(x => x.type === 'rest' ? {type:'rest'} : {type:'t', tplId:x.tplId})
  };
}
function normDay(d, date) {
  d = d && typeof d === 'object' ? d : {};
  return {
    date: date, tplId: d.tplId || null, rotIdx: Number.isInteger(d.rotIdx) ? d.rotIdx : null,
    entries: (Array.isArray(d.entries) ? d.entries : []).filter(e => e && e.exId).map(e => ({
      exId: e.exId, target: +e.target || 0,
      sets: (Array.isArray(e.sets) ? e.sets : []).filter(s => s && isFinite(+s.w) && isFinite(+s.r)).map(s => ({w:+s.w, r:+s.r}))
    }))
  };
}
const exById = id => S.cfg.exercises.find(e => e.id === id);
const catById = id => S.cfg.categories.find(c => c.id === id);
const catName = id => (catById(id) || {}).name || 'Uncategorised';
const tplById = id => S.cfg.templates.find(t => t.id === id);
const tplName = id => (tplById(id) || {}).name || 'Deleted template';
const hasContent = c => c.exercises.length > 0 || c.templates.length > 0;
const isEmptyDay = d => !d || (!d.tplId && !d.entries.length);
const ensureDay = date => S.days[date] || (S.days[date] = {date, tplId:null, rotIdx:null, entries:[]});
const sortedDays = () => Object.values(S.days).sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);

/* ---------- Storage: localStorage on this device ---------- */
const LS_KEY = 'trainingslog.v1';
const Store = {
  mode: 'loading', ver: {}, done: {}, err: false,
  cacheLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify({src:'local', cfg:S.cfg, days:S.days})); this.err = false; } catch (e) { this.err = true; } },
  loadLocal() {
    try {
      const raw = localStorage.getItem(LS_KEY); if (!raw) return null;
      const o = JSON.parse(raw); S.cfg = normCfg(o.cfg); S.days = {};
      for (const k in (o.days || {})) { const d = normDay(o.days[k], k); if (!isEmptyDay(d)) S.days[k] = d; }
      return o.src || 'local';
    } catch (e) { return null; }
  },
  dirty() { return false; },
  anyDirty() { return false; },
  schedule() { this.cacheLocal(); setSync(); },
  init() { this.loadLocal(); this.mode = 'local'; S.cfgConfirmed = true; this.cacheLocal(); render(); }
};
function saveCfg() { Store.schedule(); }
function saveDay(date) { if (isEmptyDay(S.days[date])) delete S.days[date]; Store.schedule(); }
async function writeDaysNow(dates, onProg) {
  for (const d of dates) if (isEmptyDay(S.days[d])) delete S.days[d];
  Store.cacheLocal();
  if (onProg) onProg(dates.length, dates.length);
  setSync();
}
function onWriteError() { toast('Saving failed. Your browser storage may be full or blocked.'); }
function setSync() {
  const el = $('#sync'); if (!el) return;
  let cls = 'ok', txt = navigator.onLine ? 'On this device' : 'Offline · saved';
  if (Store.mode === 'loading') { cls = ''; txt = 'Loading …'; }
  else if (Store.err) { cls = 'err'; txt = 'Not saved'; }
  else if (!navigator.onLine) cls = 'saving';
  el.className = 'sync ' + cls; el.textContent = txt;
}

/* ---------- Stats ---------- */
function sessions(exId, beforeDate) {
  const out = [];
  for (const d of Object.values(S.days)) {
    if (beforeDate && d.date >= beforeDate) continue;
    const e = d.entries.find(x => x.exId === exId);
    if (!e || !e.sets.length) continue;
    let best = 0, maxW = 0, vol = 0, maxR = 0;
    for (const s of e.sets) { best = Math.max(best, e1rm(s.w, s.r)); maxW = Math.max(maxW, s.w); vol += s.w * s.r; maxR = Math.max(maxR, s.r); }
    out.push({date:d.date, sets:e.sets, e1rm:best, maxW, vol, maxR});
  }
  return out.sort((a, b) => a.date < b.date ? 1 : -1);
}
const lastSession = (exId, date) => sessions(exId, date)[0] || null;
const bestBefore = (exId, date) => sessions(exId, date).reduce((m, s) => Math.max(m, s.e1rm), 0);
const METRICS = {
  e1rm: {label:'Est. 1RM', unit:'kg', dec:1, get:s => s.e1rm},
  maxw: {label:'Max weight', unit:'kg', dec:2, get:s => s.maxW},
  vol:  {label:'Volume', unit:'kg', dec:0, get:s => s.vol},
  reps: {label:'Max reps', unit:'reps', dec:0, get:s => s.maxR}
};

/* ---------- Rotation ---------- */
function rotIndexForDay(d) {
  const rot = S.cfg.rotation, len = rot.length; if (!len) return -1;
  if (Number.isInteger(d.rotIdx) && d.rotIdx >= 0 && d.rotIdx < len) {
    const it = rot[d.rotIdx];
    if (it.type === 'rest' || it.tplId === d.tplId || !rot.some(x => x.tplId === d.tplId)) return d.rotIdx;
  }
  return d.tplId ? rot.findIndex(x => x.tplId === d.tplId) : -1;
}
function suggest(date) {
  const rot = S.cfg.rotation, len = rot.length; if (!len) return null;
  const prev = sortedDays().filter(d => d.date < date && (d.tplId || Number.isInteger(d.rotIdx))).reverse();
  let i = -1, pd = null;
  for (const d of prev) { i = rotIndexForDay(d); if (i >= 0) { pd = d; break; } }
  if (!pd) return {item:rot[0], idx:0, after:null};
  let n = (i + 1) % len, free = daysBetween(pd.date, date) - 1, guard = 0;
  while (rot[n].type === 'rest' && free > 0 && guard < len) { free--; n = (n + 1) % len; guard++; }
  return {item:rot[n], idx:n, after:pd};
}
function nextNonRest(idx) {
  const rot = S.cfg.rotation;
  for (let k = 1; k <= rot.length; k++) { const j = (idx + k) % rot.length; if (rot[j].type !== 'rest') return {item:rot[j], idx:j}; }
  return null;
}
function startTemplate(date, tplId, rotIdx) {
  const t = tplById(tplId); if (!t) return;
  const rot = S.cfg.rotation, len = rot.length;
  if (!Number.isInteger(rotIdx)) {
    rotIdx = null;
    if (len) {
      const sg = suggest(date), base = sg ? sg.idx : 0;
      const occ = rot.map((x, i) => x.tplId === tplId ? i : -1).filter(i => i >= 0);
      if (occ.length) { occ.sort((a, b) => ((a - base + len) % len) - ((b - base + len) % len)); rotIdx = occ[0]; }
      else if (sg) rotIdx = sg.idx;
    }
  }
  const day = ensureDay(date);
  day.entries = day.entries.filter(e => e.sets.length);
  for (const it of t.items) {
    if (!exById(it.exId)) continue;
    const e = day.entries.find(x => x.exId === it.exId);
    if (e) e.target = it.sets; else day.entries.push({exId:it.exId, target:it.sets, sets:[]});
  }
  const order = t.items.map(i => i.exId);
  day.entries.sort((a, b) => { const ia = order.indexOf(a.exId), ib = order.indexOf(b.exId); return (ia < 0 ? 999 : ia) - (ib < 0 ? 999 : ib); });
  day.tplId = tplId; day.rotIdx = rotIdx;
  saveDay(date); render();
  if (!t.items.length) toast('The template "' + t.name + '" is still empty. Add exercises, then copy them into the template.');
}

/* ---------- Rendering ---------- */
function rerender() { render(); }

function render() {
  document.querySelectorAll('.tabs a').forEach(a => a.classList.toggle('on', a.getAttribute('href') === '#' + S.view));
  let h = S.netNote ? `<div class="note">${esc(S.netNote)}</div>` : '';
  if (S.view === 'workout') h += renderWorkout();
  else if (S.view === 'history') h += renderHistory();
  else if (S.view === 'exercises') h += renderExercises();
  else if (S.view === 'templates') h += renderTemplates();
  else h += renderData();
  $('#view').innerHTML = h;
  if (S.view === 'history') drawChart();
  setSync();
}

/* Workout */
function renderWorkout() {
  if (!hasContent(S.cfg) && !S.cfgConfirmed) return `<p class="empty">Loading your data …</p>`;
  if (!hasContent(S.cfg) && !S.skipOnboard) return onboardHtml();
  const date = S.date, day = S.days[date], diff = daysBetween(date, today());
  const sub = diff === 0 ? 'Today' : (diff > 0 ? `${plural(diff, 'day', 'days')} ago · back to today` : `in ${plural(-diff, 'day', 'days')} · back to today`);
  let h = `<div class="daynav">
    <button class="icon" data-act="day-prev" aria-label="Previous day">‹</button>
    <button class="dtitle" data-act="day-today"><span class="d">${esc(fmtLong(date))}</span><span class="sub">${sub}</span></button>
    <button class="icon" data-act="day-next" aria-label="Next day">›</button></div>`;
  h += planHtml(date, day);
  if (day && day.entries.length) h += day.entries.map(e => cardHtml(date, e)).join('');
  else h += `<p class="empty">Nothing logged for this day yet.</p>`;
  h += `<button class="add-ex" data-act="add-ex">+ Add exercise</button>`;
  if (day && day.tplId && tplById(day.tplId)) {
    const t = tplById(day.tplId), a = day.entries.map(e => e.exId).join('|'), b = t.items.map(i => i.exId).join('|');
    if (day.entries.length && a !== b) h += `<button class="sync-tpl" data-act="sync-tpl">Copy this day's exercises into the template "${esc(t.name)}"</button>`;
  }
  return h;
}
function onboardHtml() {
  return `<div class="onboard"><h2 class="h">Your training log</h2>
  <p class="hint">The starter pack gives you everything you had in FitNotes right away, plus templates and your rotation:</p>
  <ul><li>23 exercises, sorted into categories, each with its own weight step</li>
  <li>Templates Pull, Push, Legs, Upper, Lower and "Push (shoulder-friendly)"</li>
  <li>Rotation Pull – Push – Legs – Rest – Upper – Lower</li>
  <li>Your workouts from 6 to 11 November from the screenshots</li></ul>
  <div class="row-btns"><button class="primary" data-act="seed" data-hist="1">Load starter pack</button><button class="ghost" data-act="skip-onboard">Start empty</button></div>
  <p class="hint">Under "Data" you can also import your full FitNotes history as a CSV later.</p></div>`;
}
function planHtml(date, day) {
  const tpls = S.cfg.templates;
  if (day && day.tplId) {
    return `<div class="plan"><div class="lbl"><small>Template</small><strong>${esc(tplName(day.tplId))}</strong></div><button class="ghost sm" data-act="pick-tpl">Change</button></div>`;
  }
  const sg = suggest(date);
  let h = '<div class="plan">';
  if (sg) {
    if (sg.item.type === 'rest') {
      const nx = nextNonRest(sg.idx);
      h += `<div class="lbl"><small>Up next in rotation</small><strong>Rest day</strong></div>`;
      if (nx) h += `<button class="ghost sm" data-act="start-tpl" data-tpl="${esc(nx.item.tplId)}" data-rot="${nx.idx}">Do ${esc(tplName(nx.item.tplId))} anyway</button>`;
    } else {
      h += `<div class="lbl"><small>Up next in rotation</small><strong>${esc(tplName(sg.item.tplId))}</strong></div>`;
      h += `<button class="primary sm" data-act="start-tpl" data-tpl="${esc(sg.item.tplId)}" data-rot="${sg.idx}">Start</button>`;
    }
  } else if (tpls.length) {
    h += `<div class="lbl"><small>No rotation</small><a href="#templates">Set up rotation</a></div>`;
  } else {
    h += `<div class="lbl"><small>No templates</small><a href="#templates">Create a template</a></div>`;
  }
  if (tpls.length) h += `<button class="ghost sm" data-act="pick-tpl">Other template</button>`;
  return h + '</div>';
}
function draftFor(date, e) {
  const key = date + '|' + e.exId;
  if (S.drafts[key]) return S.drafts[key];
  let src = e.sets[e.sets.length - 1];
  if (!src) { const l = lastSession(e.exId, date); if (l) src = l.sets[0]; }
  return S.drafts[key] = {w: src ? fmtIn(src.w) : '', r: src ? String(src.r) : '', edit: null};
}
function cardHtml(date, e) {
  const ex = exById(e.exId), key = date + '|' + e.exId, dr = draftFor(date, e);
  const last = lastSession(e.exId, date), best = bestBefore(e.exId, date);
  let running = best;
  const setsHtml = e.sets.map((s, j) => {
    const v = e1rm(s.w, s.r), pr = best > 0 && v > running + 1e-9;
    if (v > running) running = v;
    return `<li class="set${dr.edit === j ? ' sel' : ''}" data-act="edit-set" data-i="${j}"><span class="n">${j + 1}</span>${pr ? '<span class="pr" title="New estimated 1RM record">PR</span>' : ''}<span class="sw"><b>${num(s.w)}</b> kg</span><span class="sr"><b>${s.r}</b> reps</span></li>`;
  }).join('');
  const tgt = e.target ? `<span class="badge${e.sets.length >= e.target ? ' done' : ''}">${e.sets.length}/${e.target} sets</span>` : '';
  const editing = dr.edit != null;
  return `<article class="card" data-ex="${esc(e.exId)}">
    <div class="card-h"><h3>${esc(ex ? ex.name : 'Deleted exercise')}<small>${esc(ex ? catName(ex.catId) : '')}</small></h3>${tgt}<button class="x" data-act="rm-entry" aria-label="Remove exercise from this day">×</button></div>
    ${last ? `<div class="last">Last time, ${esc(fmtShort(last.date))}: <b>${last.sets.map(s => num(s.w) + ' × ' + s.r).join(' · ')}</b></div>` : ''}
    <div class="steps">
      <div class="stp"><label for="w-${esc(e.exId)}">Weight (kg)</label><div class="row"><button data-act="w-" aria-label="Decrease weight">−</button><input id="w-${esc(e.exId)}" data-f="w" inputmode="decimal" autocomplete="off" value="${esc(dr.w)}"><button data-act="w+" aria-label="Increase weight">+</button></div></div>
      <div class="stp"><label for="r-${esc(e.exId)}">Reps</label><div class="row"><button data-act="r-" aria-label="Decrease reps">−</button><input id="r-${esc(e.exId)}" data-f="r" inputmode="numeric" autocomplete="off" value="${esc(dr.r)}"><button data-act="r+" aria-label="Increase reps">+</button></div></div>
    </div>
    <p class="err">${esc(S.errs[key] || '')}</p>
    <div class="card-a"><button class="primary" data-act="save-set">${editing ? 'Update set' : 'Save set'}</button>${editing ? '<button class="danger" data-act="del-set">Delete</button><button class="ghost" data-act="cancel-edit">Cancel</button>' : '<button class="ghost" data-act="clear-draft">Clear</button>'}</div>
    ${e.sets.length ? `<ol class="sets">${setsHtml}</ol>` : ''}
  </article>`;
}

/* Sidebar */
function sideHtml(scope, counter) {
  const sel = S.catSel[scope];
  const cats = S.cfg.categories.slice().sort(byName);
  let h = `<aside class="side" aria-label="Categories"><button class="${sel === '__all' ? 'on' : ''}" data-act="side" data-scope="${scope}" data-cat="__all">All <span class="cnt">${counter(null)}</span></button>`;
  for (const c of cats) h += `<button class="${sel === c.id ? 'on' : ''}" data-act="side" data-scope="${scope}" data-cat="${esc(c.id)}">${esc(c.name)} <span class="cnt">${counter(c.id)}</span></button>`;
  if (S.cfg.exercises.some(e => !catById(e.catId))) h += `<button class="${sel === '__none' ? 'on' : ''}" data-act="side" data-scope="${scope}" data-cat="__none">Uncategorised <span class="cnt">${counter('__none')}</span></button>`;
  if (scope === 'exercises') h += `<button class="add" data-act="cat-add">+ Category</button>`;
  return h + '</aside>';
}
const inCat = (e, c) => c === '__all' || c === null ? true : c === '__none' ? !catById(e.catId) : e.catId === c;

/* Exercises */
function renderExercises() {
  const sel = S.catSel.exercises;
  const counter = c => S.cfg.exercises.filter(e => !e.archived && inCat(e, c)).length;
  const list = S.cfg.exercises.filter(e => inCat(e, sel)).sort(byName);
  const act = list.filter(e => !e.archived), arch = list.filter(e => e.archived);
  const cat = catById(sel);
  const row = e => { const n = sessions(e.id).length; return `<button class="item${e.archived ? ' off' : ''}" data-act="edit-ex" data-ex="${esc(e.id)}"><span class="nm">${esc(e.name)}</span><span class="meta">${sel === '__all' ? esc(catName(e.catId)) + ' · ' : ''}Step ${num(e.step)} kg · ${plural(n, 'workout', 'workouts')}</span></button>`; };
  let c = `<div class="sh"><h2 class="h">${esc(cat ? cat.name : sel === '__none' ? 'Uncategorised' : 'All exercises')}</h2><button class="primary sm" data-act="ex-new">+ New exercise</button></div>`;
  if (cat) c += `<div class="row-btns"><button class="ghost sm" data-act="cat-rename" data-cat="${esc(cat.id)}">Rename</button><button class="ghost sm" data-act="cat-del" data-cat="${esc(cat.id)}">Delete category</button></div>`;
  c += act.length || arch.length ? `<div class="list">${act.map(row).join('')}${arch.length ? `<div class="grp">Hidden</div>${arch.map(row).join('')}` : ''}</div>` : `<p class="empty">No exercises here yet.</p>`;
  return `<div class="split">${sideHtml('exercises', counter)}<section class="col">${c}</section></div>`;
}

/* Templates */
function renderTemplates() {
  const rot = S.cfg.rotation, tpls = S.cfg.templates, sg = suggest(today());
  let h = `<section class="panel"><div class="sh"><h2>Rotation</h2>${sg ? `<span class="badge done">Up next: ${esc(sg.item.type === 'rest' ? 'Rest day' : tplName(sg.item.tplId))}</span>` : ''}</div>
    <p class="hint">Each day the app suggests the template that comes after your last workout. A rest day counts as done once you've had a day without training. If you start a different template, it takes the slot that's currently up.</p>`;
  h += rot.length ? `<ol class="rot">${rot.map((x, i) => `<li class="${x.type === 'rest' ? 'rest' : ''}${sg && sg.idx === i ? ' next' : ''}"><span class="n">${i + 1}</span><span class="nm">${x.type === 'rest' ? 'Rest day' : esc(tplName(x.tplId))}</span><button class="mini" data-act="rot-up" data-i="${i}" aria-label="Move up"${i === 0 ? ' disabled' : ''}>↑</button><button class="mini" data-act="rot-down" data-i="${i}" aria-label="Move down"${i === rot.length - 1 ? ' disabled' : ''}>↓</button><button class="mini" data-act="rot-rm" data-i="${i}" aria-label="Remove from rotation">×</button></li>`).join('')}</ol>`
    : `<p class="empty">No rotation yet. Add templates and rest days in the order you train them.</p>`;
  h += `<div class="field"><label for="rot-add">Add to rotation</label><select id="rot-add"><option value="">Choose …</option>${tpls.map(t => `<option value="${esc(t.id)}">${esc(t.name)}</option>`).join('')}<option value="__rest">Rest day</option></select></div></section>`;
  h += `<div class="sh"><h2 class="h">Templates</h2><button class="primary sm" data-act="tpl-new">+ New template</button></div>`;
  h += tpls.length ? tpls.map(t => S.tplEdit === t.id ? tplEditorHtml(t) : tplCardHtml(t)).join('') : `<p class="empty">No templates yet.</p>`;
  return h;
}
function tplCardHtml(t) {

}

      <button class="mini" data-act="ti-up" data-i="${i}" aria-label="Move up"${i === 0 ? ' disabled' : ''}>↑</button><button class="mini" data-act="ti-down" data-i="${i}" aria-label="Move down"${i === t.items.length - 1 ? ' disabled' : ''}>↓</button><button class="mini" data-act="ti-rm" data-i="${i}" aria-label="Remove">×</button></li>`).join('');

/* History */
function renderHistory() {
  const sel = S.catSel.history;
  const cnt = {}; for (const e of S.cfg.exercises) cnt[e.id] = sessions(e.id).length;
  const counter = c => S.cfg.exercises.filter(e => inCat(e, c) && cnt[e.id] > 0).length;
  const exs = S.cfg.exercises.filter(e => inCat(e, sel) && cnt[e.id] > 0).sort(byName);
  if (!S.histEx || !exById(S.histEx)) {
    const d = sortedDays().reverse().find(d => d.entries.some(e => e.sets.length));
    S.histEx = d ? d.entries.find(e => e.sets.length).exId : (exs[0] && exs[0].id) || null;
  }
  let c = '';
  if (!S.cfg.exercises.length) c = `<p class="empty">No exercises yet. Create them under "Exercises" or load the starter pack under "Data".</p>`;
  else {
    c += exs.length ? `<div class="chips" aria-label="Choose exercise">${exs.map(e => `<button class="${e.id === S.histEx ? 'on' : ''}" data-act="hist-ex" data-ex="${esc(e.id)}">${esc(e.name)}</button>`).join('')}</div>` : `<p class="empty">You haven't trained anything in this category yet.</p>`;
    if (S.histEx && (sel === '__all' || exs.some(e => e.id === S.histEx))) c += histDetail(S.histEx);
  }
  return `<div class="split">${sideHtml('history', counter)}<section class="col">${c}</section></div>`;
}
function histDetail(exId) {
  const ex = exById(exId), ss = sessions(exId);

  if (!ss.length) return h + `<p class="empty">No entries for this exercise yet.</p>`;
  const bE = ss.reduce((a, b) => b.e1rm > a.e1rm ? b : a), bW = ss.reduce((a, b) => b.maxW > a.maxW ? b : a);
  h += `<div class="tiles">
    <div class="tile"><div class="l">Est. 1RM</div><div class="v">${num(bE.e1rm, 1)} <small>kg</small></div><div class="s">${esc(fmtShort(bE.date))}</div></div>
    <div class="tile"><div class="l">Max weight</div><div class="v">${num(bW.maxW)} <small>kg</small></div><div class="s">${esc(fmtShort(bW.date))}</div></div>
    <div class="tile"><div class="l">Workouts</div><div class="v">${ss.length}</div><div class="s">since ${esc(fmtShort(ss[ss.length - 1].date))}</div></div></div>`;

function parseCSV(text) {
  text = text.replace(/^﻿/, '');

    else if (c === '"') q = true;
    else if (c === delim) { row.push(f); f = ''; }
    else if (c === '\n') { row.push(f); rows.push(row); row = []; f = ''; }
    else if (c !== '\r') f += c;
  }
  if (f || row.length) { row.push(f); rows.push(row); }

}

}

      S.cfg.exercises.push(ex); created.add(ex.id);

  for (const d of dates) {
    const day = ensureDay(d);
    for (const [exId, sets] of Object.entries(byDate[d])) { const e = day.entries.find(x => x.exId === exId); if (e) e.sets = sets; else day.entries.push({exId, target:0, sets}); }
  }
  saveCfg();
  await writeDaysNow(dates, onProg);
  return {days:dates.length, sets:nSets, created:created.size};
}

/* ---------- Toast ---------- */
let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 3200); }

/* ---------- Actions ---------- */
function cardCtx(el) {
  const card = el.closest('.card[data-ex]'); if (!card) return null;
  const exId = card.dataset.ex, key = S.date + '|' + exId, day = S.days[S.date];
  const entry = day ? day.entries.find(e => e.exId === exId) : null;
  return {card, exId, key, day, entry, ex:exById(exId), dr:entry ? draftFor(S.date, entry) : null};
}
function setErr(ctx, msg) { S.errs[ctx.key] = msg; const e = ctx.card.querySelector('.err'); if (e) e.textContent = msg; }

document.addEventListener('click', async ev => {
  const el = ev.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act;
  const i = el.dataset.i != null ? +el.dataset.i : null;
  switch (a) {
    case 'day-prev': S.date = addDays(S.date, -1); render(); window.scrollTo(0, 0); break;
    case 'day-next': S.date = addDays(S.date, 1); render(); window.scrollTo(0, 0); break;
    case 'day-today': S.date = today(); render(); break;
    case 'skip-onboard': S.skipOnboard = true; render(); break;
    case 'seed': {
      if (S.busy) return; S.busy = true;
      const cb = $('#seed-hist'); const withHist = el.dataset.hist === '1' || (cb ? cb.checked : true);
      try { await loadSeed(withHist); } finally { S.busy = false; }
      break;
    }
    case 'start-tpl': startTemplate(S.date, el.dataset.tpl, el.dataset.rot != null ? parseInt(el.dataset.rot, 10) : null); break;
    case 'pick-tpl': {
      const day = S.days[S.date];
      Modal.open(`<div class="sheet-h"><h2 class="h">Choose template</h2><button class="ghost sm" data-act="modal-close">Cancel</button></div>
        <div class="list">${S.cfg.templates.map(t => `<button class="item" data-act="pick-tpl-go" data-tpl="${esc(t.id)}"><span class="nm">${esc(t.name)}</span><span class="meta">${plural(t.items.length, 'exercise', 'exercises')}</span></button>`).join('')}</div>
        ${day && day.tplId ? '<button class="ghost" data-act="untag-day">Train without a template</button>' : ''}
        <p class="hint">Exercises that already have saved sets stay on this day.</p>`);
      break;
    }
    case 'pick-tpl-go': Modal.close(); startTemplate(S.date, el.dataset.tpl, null); break;
    case 'untag-day': { const d = S.days[S.date]; if (d) { d.tplId = null; d.rotIdx = null; d.entries = d.entries.filter(e => e.sets.length); saveDay(S.date); } Modal.close(); render(); break; }
    case 'sync-tpl': {
      const d = S.days[S.date], t = d && tplById(d.tplId); if (!t) return;
      t.items = d.entries.map(e => { const old = t.items.find(x => x.exId === e.exId); return {exId:e.exId, sets:old ? old.sets : Math.max(1, Math.min(20, e.sets.length || 2))}; });
      d.entries.forEach(e => { e.target = t.items.find(x => x.exId === e.exId).sets; });
      saveCfg(); saveDay(S.date); render(); toast('Template "' + t.name + '" updated.');
      break;
    }
    case 'add-ex': {
      const day = S.days[S.date];
      openPicker('Add exercise', exId => {
        const d = ensureDay(S.date);
        if (!d.entries.some(e => e.exId === exId)) d.entries.push({exId, target:0, sets:[]});
        saveDay(S.date); Modal.close(); render();
        const c = document.querySelector(`.card[data-ex="${CSS.escape(exId)}"]`); if (c) c.scrollIntoView({block:'center'});
      }, day ? day.entries.map(e => e.exId) : []);
      break;
    }
    case 'w-': case 'w+': case 'r-': case 'r+': {
      const c = cardCtx(el); if (!c || !c.dr) return;
      const f = a[0], inp = c.card.querySelector(`[data-f="${f}"]`);
      let v = parseNum(inp.value); if (!isFinite(v)) v = 0;
      const st = f === 'w' ? (c.ex ? c.ex.step : 2.5) : (c.ex ? c.ex.repStep : 1);
      v = a[1] === '+' ? v + st : v - st;
      v = Math.max(0, f === 'w' ? r2(v) : Math.round(v));
      inp.value = f === 'w' ? fmtIn(v) : String(v); c.dr[f] = inp.value;
      if (S.errs[c.key]) setErr(c, '');
      break;
    }
    case 'save-set': {
      const c = cardCtx(el); if (!c || !c.entry) return;
      const w = parseNum(c.card.querySelector('[data-f="w"]').value), rv = String(c.card.querySelector('[data-f="r"]').value).trim(), r = parseInt(rv, 10);
      if (!(w >= 0)) return setErr(c, 'Enter a weight, or 0 for bodyweight.');
      if (!/^\d+$/.test(rv) || !(r >= 1)) return setErr(c, 'Enter at least 1 rep as a whole number.');
      const s = {w:r2(w), r};
      if (c.dr.edit != null && c.entry.sets[c.dr.edit]) c.entry.sets[c.dr.edit] = s; else c.entry.sets.push(s);
      c.dr.edit = null; c.dr.w = fmtIn(s.w); c.dr.r = String(s.r); delete S.errs[c.key];
      saveDay(S.date); render();
      break;
    }
    case 'clear-draft': { const c = cardCtx(el); if (!c) return; c.dr.w = ''; c.dr.r = ''; c.card.querySelectorAll('[data-f]').forEach(x => x.value = ''); break; }
    case 'cancel-edit': { const c = cardCtx(el); if (!c) return; c.dr.edit = null; const ls = c.entry.sets[c.entry.sets.length - 1]; if (ls) { c.dr.w = fmtIn(ls.w); c.dr.r = String(ls.r); } render(); break; }
    case 'edit-set': {
      const c = cardCtx(el); if (!c || !c.entry) return;
      if (c.dr.edit === i) { c.dr.edit = null; } else { const s = c.entry.sets[i]; c.dr.edit = i; c.dr.w = fmtIn(s.w); c.dr.r = String(s.r); }
      delete S.errs[c.key]; render();
      break;
    }
    case 'del-set': { const c = cardCtx(el); if (!c || c.dr.edit == null) return; c.entry.sets.splice(c.dr.edit, 1); c.dr.edit = null; saveDay(S.date); render(); break; }
    case 'rm-entry': {
      const c = cardCtx(el); if (!c || !c.entry) return;
      if (c.entry.sets.length && !(await confirmDlg(`Remove "${c.ex ? c.ex.name : 'exercise'}" with ${plural(c.entry.sets.length, 'set', 'sets')} from this day?`, 'Remove', true))) return;
      Modal.close();
      const d = S.days[S.date]; d.entries = d.entries.filter(e => e.exId !== c.exId); delete S.drafts[c.key];
      saveDay(S.date); render();
      break;
    }
    case 'modal-close': Modal.close(); break;
    case 'cf-yes': if (S.cfResolve) { const r = S.cfResolve; S.cfResolve = null; r(true); } break;
    case 'cf-no': Modal.close(); break;
    case 'td-ok': { const v = $('#td-in').value.trim(); if (!v) { $('#td-err').textContent = 'Enter a name.'; return; } const cb = S.textCb; S.textCb = null; const err = cb(v); if (err) { $('#td-err').textContent = err; S.textCb = cb; return; } Modal.close(); render(); break; }
    case 'pk-cat': S.picker.cat = el.dataset.cat; renderPicker(); break;
    case 'pk-pick': { const cb = S.picker.cb; cb(el.dataset.ex); break; }
    case 'pk-new': { const p = S.picker; editExercise(null, {name:p.q, catId:p.cat, after:p.cb}); break; }
    case 'side': S.catSel[el.dataset.scope] = el.dataset.cat; if (el.dataset.scope === 'history') { const f = S.cfg.exercises.filter(e => inCat(e, el.dataset.cat) && sessions(e.id).length); if (f.length && !f.some(e => e.id === S.histEx)) S.histEx = f.sort(byName)[0].id; } render(); break;
    case 'cat-add': textDlg('New category', 'Name', '', 'Create', v => { if (S.cfg.categories.some(c => low(c.name) === low(v))) return 'That category already exists.'; const id = getOrCreateCat(v); S.catSel.exercises = id; saveCfg(); }); break;
    case 'cat-rename': { const c = catById(el.dataset.cat); if (!c) return; textDlg('Rename category', 'Name', c.name, 'Save', v => { if (S.cfg.categories.some(x => x.id !== c.id && low(x.name) === low(v))) return 'That category already exists.'; c.name = v; saveCfg(); }); break; }
    case 'cat-del': {
      const c = catById(el.dataset.cat); if (!c) return;
      if (S.cfg.exercises.some(e => e.catId === c.id)) { toast('Move or delete the exercises in "' + c.name + '" first.'); return; }
      if (!(await confirmDlg(`Delete the category "${c.name}"?`, 'Delete', true))) return;
      Modal.close(); S.cfg.categories = S.cfg.categories.filter(x => x.id !== c.id); S.catSel.exercises = '__all'; saveCfg(); render();
      break;
    }
    case 'ex-new': editExercise(null, {catId:S.catSel.exercises}); break;
    case 'edit-ex': editExercise(el.dataset.ex); break;
    case 'ex-stepchip': $('#ex-step').value = fmtIn(+el.dataset.v); break;
    case 'ex-save': {
      const err = m => { $('#ex-err').textContent = m; };
      const name = $('#ex-name').value.trim(); if (!name) return err('Enter a name.');
      const id = S.exEdit && S.exEdit.id;
      if (S.cfg.exercises.some(e => e.id !== id && low(e.name) === low(name))) return err('An exercise with this name already exists.');
      let catId = $('#ex-cat').value;
      if (catId === '__new') { const cn = $('#ex-newcat').value.trim(); if (!cn) return err('Enter a name for the new category.'); catId = getOrCreateCat(cn); }
      const step = parseNum($('#ex-step').value); if (!(step > 0)) return err('The weight step must be greater than 0.');
      const rs = parseInt($('#ex-rstep').value, 10); if (!(rs >= 1)) return err('The rep step must be at least 1.');
      let nid = id;
      if (id) Object.assign(exById(id), {name, catId, step:r2(step), repStep:rs});
      else { nid = newId(); S.cfg.exercises.push({id:nid, name, catId, step:r2(step), repStep:rs, aliases:[], archived:false}); }
      saveCfg();
      const after = S.exEdit && S.exEdit.after;
      Modal.close();
      if (after) after(nid); else { toast(id ? 'Exercise saved.' : 'Exercise created.'); render(); }
      break;
    }
    case 'ex-archive': { const ex = exById(S.exEdit.id); ex.archived = !ex.archived; saveCfg(); Modal.close(); render(); toast(ex.archived ? 'Exercise hidden.' : 'Exercise shown again.'); break; }
    case 'ex-delete': {
      const id = S.exEdit.id;
      S.cfg.exercises = S.cfg.exercises.filter(e => e.id !== id);
      S.cfg.templates.forEach(t => { t.items = t.items.filter(x => x.exId !== id); });
      Object.values(S.days).filter(d => d.entries.some(e => e.exId === id)).forEach(d => { d.entries = d.entries.filter(e => e.exId !== id); saveDay(d.date); });
      saveCfg(); Modal.close(); render(); toast('Exercise deleted.');
      break;
    }
    case 'hist-ex': S.histEx = el.dataset.ex; render(); break;
    case 'metric': S.metric = el.dataset.m; render(); break;
    case 'goto-day': S.date = el.dataset.date; if (location.hash === '#workout') render(); else location.hash = '#workout'; window.scrollTo(0, 0); break;
    case 'rot-up': case 'rot-down': { const r = S.cfg.rotation, j = a === 'rot-up' ? i - 1 : i + 1; if (j < 0 || j >= r.length) return; [r[i], r[j]] = [r[j], r[i]]; saveCfg(); render(); break; }
    case 'rot-rm': S.cfg.rotation.splice(i, 1); saveCfg(); render(); break;
    case 'tpl-new': { const t = {id:newId(), name:'New template', items:[]}; S.cfg.templates.push(t); S.tplEdit = t.id; saveCfg(); render(); const n = $('#tpl-name'); if (n) { n.focus(); n.select(); } break; }
    case 'tpl-edit': S.tplEdit = el.dataset.tpl; render(); break;
    case 'tpl-done': { const t = tplById(S.tplEdit); if (t && !t.name.trim()) { t.name = 'Template'; saveCfg(); } S.tplEdit = null; render(); break; }
    case 'tpl-del': {
      const t = tplById(S.tplEdit); if (!t) return;
      if (!(await confirmDlg(`Delete the template "${t.name}"? It will also be removed from the rotation. Your workouts are kept.`, 'Delete', true))) return;
      Modal.close();
      S.cfg.templates = S.cfg.templates.filter(x => x.id !== t.id); S.cfg.rotation = S.cfg.rotation.filter(x => x.tplId !== t.id); S.tplEdit = null;
      saveCfg(); render();
      break;
    }
    case 'ti-sets-': case 'ti-sets+': { const t = tplById(S.tplEdit); const it = t.items[i]; it.sets = Math.max(1, Math.min(20, it.sets + (a.endsWith('+') ? 1 : -1))); saveCfg(); render(); break; }
    case 'ti-up': case 'ti-down': { const t = tplById(S.tplEdit), r = t.items, j = a === 'ti-up' ? i - 1 : i + 1; if (j < 0 || j >= r.length) return; [r[i], r[j]] = [r[j], r[i]]; saveCfg(); render(); break; }
    case 'ti-rm': { const t = tplById(S.tplEdit); t.items.splice(i, 1); saveCfg(); render(); break; }
    case 'ti-add': {
      const t = tplById(S.tplEdit); if (!t) return;
      openPicker('Add exercise to template', exId => { const tt = tplById(S.tplEdit); if (tt && !tt.items.some(x => x.exId === exId)) tt.items.push({exId, sets:2}); saveCfg(); Modal.close(); render(); }, t.items.map(x => x.exId));
      break;
    }
    case 'backup-download': {
      const txt = JSON.stringify({app:'trainingslog', v:1, exported:new Date().toISOString(), cfg:S.cfg, days:S.days});
      const url = URL.createObjectURL(new Blob([txt], {type:'application/json'}));
      const dl = document.createElement('a'); dl.href = url; dl.download = 'training-log-backup-' + today() + '.json';
      document.body.appendChild(dl); dl.click(); dl.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000);
      toast('Downloading backup.');
      break;
    }
    case 'backup-copy': {
      const txt = JSON.stringify({app:'trainingslog', v:1, exported:new Date().toISOString(), cfg:S.cfg, days:S.days});
      try { await navigator.clipboard.writeText(txt); toast('Backup copied to the clipboard.'); }
      catch (e) { const ta = $('#backup-in'); ta.value = txt; ta.focus(); ta.select(); $('#bk-status').textContent = "Copying didn't work automatically. The text is selected below, copy it by hand."; }
      break;
    }
    case 'backup-restore': {
      const st = $('#bk-status'); let o;
      try { o = JSON.parse($('#backup-in').value); } catch (e) { st.textContent = "That isn't a valid backup. Paste the complete copied text."; return; }
      if (!o || o.app !== 'trainingslog' || !o.cfg) { st.textContent = "That isn't a backup from this app."; return; }
      if (!(await confirmDlg('All current exercises, templates and workouts will be replaced by the backup.', 'Replace', true))) return;
      Modal.close();
      S.cfg = normCfg(o.cfg); S.days = {};
      for (const k in (o.days || {})) { if (/^\d{4}-\d{2}-\d{2}$/.test(k)) { const d = normDay(o.days[k], k); if (!isEmptyDay(d)) S.days[k] = d; } }
      S.drafts = {}; S.skipOnboard = true;
      Store.cacheLocal(); render(); toast('Backup restored.');
      break;
    }
  }
});

document.addEventListener('input', ev => {
  const t = ev.target;
  if (t.dataset && t.dataset.f) {
    const c = cardCtx(t); if (!c || !c.dr) return;
    c.dr[t.dataset.f] = t.value; if (S.errs[c.key]) setErr(c, '');
  } else if (t.id === 'pk-q' && S.picker) { S.picker.q = t.value; renderPicker(); }
  else if (t.id === 'tpl-name') { const tp = tplById(t.dataset.tpl); if (tp) { tp.name = t.value; saveCfg(); } }
});
document.addEventListener('change', async ev => {
  const t = ev.target;
  if (t.id === 'rot-add' && t.value) { S.cfg.rotation.push(t.value === '__rest' ? {type:'rest'} : {type:'t', tplId:t.value}); saveCfg(); render(); }
  else if (t.id === 'ex-cat') { $('#ex-newcat-f').hidden = t.value !== '__new'; }
  else if (t.id === 'backup-file' && t.files && t.files[0]) {
    try { $('#backup-in').value = await t.files[0].text(); $('#bk-status').textContent = 'Backup loaded. Tap "Restore and replace everything" to apply it.'; }
    catch (e) { $('#bk-status').textContent = "The file couldn't be read."; }
  }
  else if (t.id === 'tpl-name' && !t.value.trim()) { const tp = tplById(t.dataset.tpl); if (tp) { tp.name = 'Template'; t.value = 'Template'; saveCfg(); } }
  else if (t.id === 'csv-file' && t.files && t.files[0]) {
    const st = $('#imp-status'); st.textContent = 'Reading file …';
    try {
      const text = await t.files[0].text();
      const res = await importCSV(text);
      S.skipOnboard = true; render();
      const s2 = $('#imp-status'); if (s2) s2.textContent = `Imported ${plural(res.days, 'training day', 'training days')} with ${plural(res.sets, 'set', 'sets')}${res.created ? `, ${plural(res.created, 'new exercise', 'new exercises')} created` : ''}.`;
      toast('FitNotes import finished.');
    } catch (e) { const s = $('#imp-status'); if (s) s.textContent = (e && e.message) || "The import didn't work."; }
  }
});
document.addEventListener('keydown', ev => {
  const t = ev.target;
  if (ev.key === 'Enter' && t.dataset && t.dataset.f) { ev.preventDefault(); const c = t.closest('.card'); const b = c && c.querySelector('[data-act="save-set"]'); if (b) b.click(); }
  else if (ev.key === 'Enter' && t.id === 'td-in') { ev.preventDefault(); const b = document.querySelector('[data-act="td-ok"]'); if (b) b.click(); }
  else if (ev.key === 'Escape' && !$('#modal').hidden) Modal.close();
});

/* ---------- Navigation ---------- */
const VIEWS = ['workout', 'history', 'exercises', 'templates', 'data'];
function fromHash() { const h = location.hash.slice(1); S.view = VIEWS.includes(h) ? h : 'workout'; }
window.addEventListener('hashchange', () => { fromHash(); S.tplEdit = null; render(); window.scrollTo(0, 0); });
window.addEventListener('online', setSync); window.addEventListener('offline', setSync);
fromHash();
Store.init();
</script>
</body>
